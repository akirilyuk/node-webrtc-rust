name: Build native addon (Linux)
description: Cache, compile, verify, manifest, and optionally upload a Linux .node binding

inputs:
  target:
    description: Rust triple (e.g. x86_64-unknown-linux-gnu)
    required: true
  profile:
    description: napi profile (debug or release)
    required: false
    default: release
  cache_prefix:
    description: Prefix for Swatinem/rust-cache
    required: false
    default: v1-native-release
  cache_target_label:
    description: Runner arch label for target/ cache (Linux-x64 or Linux-arm64)
    required: false
    default: Linux-x64
  setup_host_toolchain:
    description: Install Node/Rust/apt deps on GitHub-hosted Linux (no ci-build container)
    required: false
    default: 'false'
  platform:
    description: Pass --platform to napi build
    required: false
    default: 'true'
  zig:
    description: Pass --zig to napi build
    required: false
    default: 'true'
  skip_build_on_cache_hit:
    description: Skip compile when native-binding-cache hit
    required: false
    default: 'false'
  native_cache_hit:
    description: Value from native-binding-cache output
    required: false
    default: 'false'
  binding_cache_key:
    description: Exact cache key from native-binding-cache (enables save after compile)
    required: false
    default: ''
  upload_artifact:
    description: Upload bindings artifact
    required: false
    default: 'true'
  sherpa_onnx_lib_dir:
    description: SHERPA_ONNX_LIB_DIR for musl builds (musl Sherpa shared libs)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve build required
      id: resolve
      shell: bash
      run: |
        if [[ "${{ inputs.skip_build_on_cache_hit }}" == "true" && "${{ inputs.native_cache_hit }}" == "true" ]]; then
          echo "build_required=false" >> "$GITHUB_OUTPUT"
        else
          echo "build_required=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve binding cache key
      id: cachekey
      shell: bash
      env:
        NATIVE_TOOL_MODE: declared
      run: |
        set -euo pipefail
        key="${{ inputs.binding_cache_key }}"
        if [[ -z "$key" ]]; then
          eval "$(bash scripts/ci/collect-native-tool-identity.sh --target "${{ inputs.target }}")"
          key="$(python3 scripts/ci/native_build_contract.py cache-key --target "${{ inputs.target }}" --profile "${{ inputs.profile }}")"
        fi
        echo "cache-key=${key}" >> "$GITHUB_OUTPUT"

    - name: Install Linux build dependencies
      if: inputs.setup_host_toolchain == 'true' && steps.resolve.outputs.build_required == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          ca-certificates \
          cmake \
          curl \
          pkg-config

    - name: Setup Node.js
      if: inputs.setup_host_toolchain == 'true' && steps.resolve.outputs.build_required == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Rust toolchain
      if: inputs.setup_host_toolchain == 'true' && steps.resolve.outputs.build_required == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    # Exact target/ restore only — no restore-keys (stale cross-target/Sherpa
    # trees previously caused link failures). Registry via Swatinem alone
    # (no overlapping actions/cache for registry).
    - name: Restore Cargo target/ (exact key)
      if: steps.resolve.outputs.build_required == 'true'
      id: target-restore
      uses: actions/cache/restore@v4
      with:
        path: target
        key: cargo-tgt-v1-${{ inputs.profile }}-${{ inputs.target }}-${{ inputs.cache_prefix }}-${{ hashFiles('Cargo.lock', 'docker/ci/Dockerfile', 'docker/ci/Dockerfile.alpine', 'scripts/ci/install-alpine-native-toolchain.sh', 'scripts/ci/build-sherpa-onnx-musl-libs.sh') }}

    - name: Cache Cargo registry (Swatinem; targets disabled)
      if: steps.resolve.outputs.build_required == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: cargo-reg-v1-${{ inputs.cache_prefix }}-${{ inputs.profile }}
        cache-targets: 'false'
        workspaces: .
        shared-key: registry
        add-job-id-key: false
        add-rust-environment-hash-key: false

    - name: Cache napi-rs Zig toolchain
      if: inputs.zig == 'true' && steps.resolve.outputs.build_required == 'true'
      uses: actions/cache@v4
      with:
        path: /github/home/.cache/napi-rs-nodejs
        key: napi-zig-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: napi-zig-${{ runner.os }}-

    - name: Install bindings dependencies
      if: steps.resolve.outputs.build_required == 'true'
      shell: bash
      working-directory: packages/bindings
      run: |
        set -euo pipefail
        if npm ci --ignore-scripts --omit=optional; then
          exit 0
        fi
        echo "npm ci failed (release-prep lock drift); installing @napi-rs/cli only" >&2
        rm -rf node_modules
        npm install --ignore-scripts --no-save --omit=optional @napi-rs/cli@^2.18.0

    - name: Reuse cached native addon
      if: steps.resolve.outputs.build_required != 'true'
      shell: bash
      run: echo "::notice::Reusing cached native addon for ${{ inputs.target }} — skipping Rust/npm setup and compile"

    - name: Build native addon
      if: steps.resolve.outputs.build_required == 'true'
      shell: bash
      working-directory: packages/bindings
      env:
        CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        OPUS_STATIC: '1'
      run: |
        set -euo pipefail
        unset SHERPA_ONNX_LIB_DIR
        if [[ -n "${{ inputs.sherpa_onnx_lib_dir }}" ]]; then
          export SHERPA_ONNX_LIB_DIR="${{ inputs.sherpa_onnx_lib_dir }}"
          export LD_LIBRARY_PATH="${SHERPA_ONNX_LIB_DIR}:/usr/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
        fi
        rm -f *.node
        args=(build --target "${{ inputs.target }}")
        if [[ "${{ inputs.profile }}" == "release" ]]; then
          args+=(--release --features otel)
        fi
        if [[ "${{ inputs.platform }}" == "true" ]]; then
          args+=(--platform)
        fi
        if [[ "${{ inputs.zig }}" == "true" ]]; then
          args+=(--zig)
        fi
        npx napi "${args[@]}"
        if [[ "${{ inputs.platform }}" != "true" ]]; then
          npm run copy:local-node
        fi

    - name: Verify native NAPI surface
      if: steps.resolve.outputs.build_required == 'true'
      shell: bash
      run: |
        unset SHERPA_ONNX_LIB_DIR
        if [[ -n "${{ inputs.sherpa_onnx_lib_dir }}" ]]; then
          export SHERPA_ONNX_LIB_DIR="${{ inputs.sherpa_onnx_lib_dir }}"
          export LD_LIBRARY_PATH="${SHERPA_ONNX_LIB_DIR}:/usr/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
        fi
        node scripts/ci/verify-native-binding-surface.mjs --target "${{ inputs.target }}"

    - name: Verify musl runtime on Alpine
      if: steps.resolve.outputs.build_required == 'true' && inputs.target == 'x86_64-unknown-linux-musl'
      shell: bash
      run: bash scripts/ci/verify-musl-runtime.sh

    - name: Require native artifact
      shell: bash
      working-directory: packages/bindings
      run: |
        shopt -s nullglob
        files=(*.node)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No .node artifact for ${{ inputs.target }}." >&2
          exit 1
        fi

    - name: Write provenance manifest
      shell: bash
      env:
        NATIVE_TOOL_MODE: declared
        NATIVE_PRODUCER_GIT_SHA: ${{ github.sha }}
        NATIVE_PRODUCER_RUN_ID: ${{ github.run_id }}
        NATIVE_PRODUCER_WORKFLOW: ${{ github.workflow }}
        SHERPA_ONNX_LIB_DIR: ${{ inputs.sherpa_onnx_lib_dir }}
      run: |
        set -euo pipefail
        if [[ -n "${{ inputs.sherpa_onnx_lib_dir }}" ]]; then
          export SHERPA_ONNX_LIB_DIR="${{ inputs.sherpa_onnx_lib_dir }}"
          export NATIVE_SHERPA_ONNX_LIB_DIR="$SHERPA_ONNX_LIB_DIR"
        fi
        bash scripts/ci/write-native-artifact-manifest.sh \
          --target "${{ inputs.target }}" \
          --profile "${{ inputs.profile }}"

    - name: Save native binding cache
      if: steps.resolve.outputs.build_required == 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          packages/bindings/*.node
          packages/bindings/native-manifests/${{ inputs.target }}.json
        key: ${{ steps.cachekey.outputs.cache-key }}

    - name: Save Cargo target/ (exact key; miss only)
      if: steps.resolve.outputs.build_required == 'true' && steps.target-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: target
        key: cargo-tgt-v1-${{ inputs.profile }}-${{ inputs.target }}-${{ inputs.cache_prefix }}-${{ hashFiles('Cargo.lock', 'docker/ci/Dockerfile', 'docker/ci/Dockerfile.alpine', 'scripts/ci/install-alpine-native-toolchain.sh', 'scripts/ci/build-sherpa-onnx-musl-libs.sh') }}

    - name: Stage artifact directory
      if: inputs.upload_artifact == 'true'
      shell: bash
      run: |
        set -euo pipefail
        dest="ci-native-out/bindings-${{ inputs.target }}"
        mkdir -p "$dest"
        cp packages/bindings/*.node "$dest/"
        cp "packages/bindings/native-manifests/${{ inputs.target }}.json" "$dest/manifest.json"

    - name: Upload bindings artifact
      if: inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: bindings-${{ inputs.target }}
        path: ci-native-out/bindings-${{ inputs.target }}/
        if-no-files-found: error

    - name: Remove Cargo target/ from workspace
      if: always() && steps.resolve.outputs.build_required == 'true'
      shell: bash
      run: rm -rf target
