name: Cache Sherpa E2E models
description: Restore/save English Sherpa STT/TTS model dirs used by integration E2E (separate from native/Cargo)

outputs:
  cache-hit:
    description: Exact Actions cache key match
    value: ${{ steps.models.outputs.cache-hit }}
  cache-key:
    description: Exact Actions cache key
    value: ${{ steps.key.outputs.cache-key }}

runs:
  using: composite
  steps:
    - name: Resolve Sherpa models cache key
      id: key
      shell: bash
      run: |
        set -euo pipefail
        digest="$(bash scripts/ci/sherpa-models-cache-key.sh)"
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        echo "cache-key=sherpa-models-v1-${digest}" >> "$GITHUB_OUTPUT"

    - name: Restore Sherpa model dirs
      id: models
      uses: actions/cache@v4
      with:
        path: |
          examples/voice-agent-local-sherpa/.models/sherpa-onnx-streaming-zipformer-en-kroko-2025-08-06
          examples/voice-agent-local-sherpa/.models/vits-piper-en_US-amy-low
        key: ${{ steps.key.outputs.cache-key }}

    - name: Ensure models valid (redownload on corrupt/miss)
      id: ensure
      shell: bash
      run: bash scripts/ci/ensure-sherpa-models.sh

    # Exact-hit + corrupt restore cannot overwrite the same key; delete then save.
    - name: Evict corrupt Sherpa model cache entry
      if: steps.models.outputs.cache-hit == 'true' && steps.ensure.outputs.redownloaded == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_KEY: ${{ steps.key.outputs.cache-key }}
      run: |
        set -euo pipefail
        enc="$(printf '%s' "$CACHE_KEY" | python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=""))')"
        body="$(curl -fsSL \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100&key=${enc}" || true)"
        ids="$(
          BODY="$body" CACHE_KEY="$CACHE_KEY" python3 -c '
        import json, os
        data = json.loads(os.environ.get("BODY") or "{}")
        key = os.environ["CACHE_KEY"]
        print(" ".join(str(c["id"]) for c in (data.get("actions_caches") or []) if c.get("key") == key and c.get("id") is not None))
        '
        )"
        for id in $ids; do
          echo "Deleting corrupt cache id=${id} key=${CACHE_KEY}"
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" || true
        done

    - name: Save Sherpa model dirs
      if: steps.models.outputs.cache-hit != 'true' || steps.ensure.outputs.redownloaded == 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          examples/voice-agent-local-sherpa/.models/sherpa-onnx-streaming-zipformer-en-kroko-2025-08-06
          examples/voice-agent-local-sherpa/.models/vits-piper-en_US-amy-low
        key: ${{ steps.key.outputs.cache-key }}
