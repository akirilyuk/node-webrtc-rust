name: Native binding cache
description: >
  Probe or restore per-target .node keyed by native-v3 target-specific fingerprint.
  Probe mode checks the Actions Cache API without downloading (~162MB).

inputs:
  target:
    description: Rust triple (e.g. x86_64-unknown-linux-gnu)
    required: true
  profile:
    description: Cargo/napi profile (debug or release)
    required: false
    default: release
  mode:
    description: >
      restore = download + validate (default). probe = Actions Cache API existence
      check only (no download); Test restores later when the key is already warm.
    required: false
    default: restore

outputs:
  cache-hit:
    description: Cache usable (probe found key, or restore validated .node)
    value: ${{ steps.result.outputs.cache-usable }}
  cache-key:
    description: Exact cache key (pass to cache/save after compile)
    value: ${{ steps.key.outputs.cache-key }}
  input-digest:
    description: Native input digest for this target
    value: ${{ steps.key.outputs.input-digest }}

runs:
  using: composite
  steps:
    - name: Compute native binding cache key
      id: key
      shell: bash
      env:
        NATIVE_TOOL_MODE: declared
        CI_IMAGE: ${{ env.CI_IMAGE }}
        CI_IMAGE_ALPINE: ${{ env.CI_IMAGE_ALPINE }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        eval "$(bash scripts/ci/collect-native-tool-identity.sh --target "${{ inputs.target }}")"
        key="$(python3 scripts/ci/native_build_contract.py cache-key --target "${{ inputs.target }}" --profile "${{ inputs.profile }}")"
        digest="${key##*-}"
        echo "cache-key=${key}" >> "$GITHUB_OUTPUT"
        echo "input-digest=${digest}" >> "$GITHUB_OUTPUT"
        echo "Native binding cache key=${key}"

    # BusyBox tar on Alpine rejects actions/cache --posix/-P (musl jobs).
    - name: Ensure GNU tar for Actions cache (Alpine)
      if: inputs.mode != 'probe' && inputs.target == 'x86_64-unknown-linux-musl'
      shell: bash
      run: bash scripts/ci/ensure-gnu-tar-alpine.sh

    - name: Probe native binding cache (no download)
      id: probe
      if: inputs.mode == 'probe'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CACHE_KEY: ${{ steps.key.outputs.cache-key }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        enc_key="$(printf '%s' "$CACHE_KEY" | python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=""))')"
        url="https://api.github.com/repos/${REPO}/actions/caches?per_page=100&key=${enc_key}"
        body="$(curl -fsSL \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "$url")"
        hits="$(CACHE_KEY="$CACHE_KEY" python3 -c '
        import json, os, sys
        data = json.load(sys.stdin)
        key = os.environ["CACHE_KEY"]
        n = sum(1 for c in data.get("actions_caches") or [] if c.get("key") == key)
        print(n)
        ' <<<"$body")"
        if [[ "$hits" -gt 0 ]]; then
          echo "cache-present=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Native binding cache key present (${hits} entr(y/ies)) — skipping download; Test will restore."
        else
          echo "cache-present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Native binding cache key miss — will compile and upload artifact for Test."
        fi

    - name: Restore native binding cache
      id: restore
      if: inputs.mode != 'probe'
      uses: actions/cache/restore@v4
      with:
        path: |
          packages/bindings/*.node
          packages/bindings/native-manifests/${{ inputs.target }}.json
        key: ${{ steps.key.outputs.cache-key }}

    - name: Validate restored .node against index.d.ts + manifest
      id: validate
      if: inputs.mode != 'probe'
      shell: bash
      env:
        NATIVE_TOOL_MODE: declared
      run: |
        set -euo pipefail
        shopt -s nullglob
        nodes=(packages/bindings/*.node)
        if [[ ${#nodes[@]} -eq 0 ]]; then
          echo "No .node to validate (cache miss)."
          echo "cache-usable=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! node scripts/ci/verify-native-binding-surface.mjs --target "${{ inputs.target }}"; then
          echo "Cached .node stale vs index.d.ts — removing and forcing compile."
          rm -f packages/bindings/*.node
          rm -f "packages/bindings/native-manifests/${{ inputs.target }}.json"
          echo "cache-usable=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        eval "$(bash scripts/ci/collect-native-tool-identity.sh --target "${{ inputs.target }}")"
        man="packages/bindings/native-manifests/${{ inputs.target }}.json"
        if [[ -f "$man" ]]; then
          if ! bash scripts/ci/native-artifact-manifest.sh validate --manifest "$man"; then
            echo "Cached manifest invalid — removing and forcing compile."
            rm -f packages/bindings/*.node "$man"
            echo "cache-usable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        else
          # Older cache entries without manifest: accept surface check, produce manifest later.
          echo "::notice::Cache hit without provenance manifest — will refresh on save path."
        fi
        echo "cache-usable=true" >> "$GITHUB_OUTPUT"

    - name: Export cache-hit
      id: result
      shell: bash
      run: |
        if [[ "${{ inputs.mode }}" == "probe" ]]; then
          if [[ "${{ steps.probe.outputs.cache-present }}" == "true" ]]; then
            echo "cache-usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache-usable=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "cache-usable=${{ steps.validate.outputs.cache-usable }}" >> "$GITHUB_OUTPUT"
        fi
