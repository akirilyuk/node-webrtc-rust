name: Build & Test (main)

on:
  push:
    branches: [main]

# Rapid successive pushes to main cancel the prior in-flight run.
concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CI_IMAGE: ghcr.io/${{ github.repository }}/ci-build:latest
  CI_IMAGE_ALPINE: ghcr.io/${{ github.repository }}/ci-build-alpine:latest
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  OPUS_STATIC: '1'
  NATIVE_TOOL_MODE: declared

jobs:
  validate-package-lock:
    name: Package-lock optional bindings
    runs-on: self-hosted
    steps:
      # Composite ownership action needs a checkout; pre-checkout reset stays inline.
      - name: Prepare workspace
        run: |
          if [[ -n "${RUNNER_WORKSPACE:-}" && -d "${RUNNER_WORKSPACE}" ]]; then
            docker run --rm \
              -v "${RUNNER_WORKSPACE}:${RUNNER_WORKSPACE}" \
              alpine:3.20 \
              chown -R "$(id -u):$(id -g)" "${RUNNER_WORKSPACE}" || true
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ./.github/actions/validate-package-lock

  quality:
    name: Typecheck & lint
    needs: validate-package-lock
    runs-on: self-hosted
    steps:
      - name: Prepare workspace
        run: |
          if [[ -n "${RUNNER_WORKSPACE:-}" && -d "${RUNNER_WORKSPACE}" ]]; then
            docker run --rm \
              -v "${RUNNER_WORKSPACE}:${RUNNER_WORKSPACE}" \
              alpine:3.20 \
              chown -R "$(id -u):$(id -g)" "${RUNNER_WORKSPACE}" || true
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bash scripts/ci/run-pr-quality.sh

  build-ts:
    name: Build TypeScript
    needs: [validate-package-lock, quality]
    runs-on: self-hosted
    steps:
      - name: Prepare workspace
        run: |
          if [[ -n "${RUNNER_WORKSPACE:-}" && -d "${RUNNER_WORKSPACE}" ]]; then
            docker run --rm \
              -v "${RUNNER_WORKSPACE}:${RUNNER_WORKSPACE}" \
              alpine:3.20 \
              chown -R "$(id -u):$(id -g)" "${RUNNER_WORKSPACE}" || true
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ./.github/actions/ci-cache-ts-dist
        id: ts-cache
        with:
          node_major: '20'

      - name: Build TypeScript packages
        if: steps.ts-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/ci/validate-package-lock-optional-bindings.sh
          npm ci
          bash scripts/fix-rollup-native.sh
          bash scripts/ci/build-ts-workspace.sh

  plan:
    name: Plan native builds
    needs: [validate-package-lock, quality, build-ts]
    runs-on: self-hosted
    outputs:
      linux_x64_matrix: ${{ steps.plan.outputs.linux_x64_matrix }}
      build_linux_arm64: ${{ steps.plan.outputs.build_linux_arm64 }}
      build_linux_musl: ${{ steps.plan.outputs.build_linux_musl }}
      host_matrix: ${{ steps.plan.outputs.host_matrix }}
      cached_linux_x64: ${{ steps.plan.outputs.cached_linux_x64 }}
      cached_linux_arm64: ${{ steps.plan.outputs.cached_linux_arm64 }}
      cached_host: ${{ steps.plan.outputs.cached_host }}
      all_cached: ${{ steps.plan.outputs.all_cached }}
      aggregate_digest: ${{ steps.plan.outputs.aggregate_digest }}
    steps:
      - name: Prepare workspace
        run: |
          if [[ -n "${RUNNER_WORKSPACE:-}" && -d "${RUNNER_WORKSPACE}" ]]; then
            docker run --rm \
              -v "${RUNNER_WORKSPACE}:${RUNNER_WORKSPACE}" \
              alpine:3.20 \
              chown -R "$(id -u):$(id -g)" "${RUNNER_WORKSPACE}" || true
          fi

      - uses: actions/checkout@v4

      - uses: ./.github/actions/plan-native-builds
        id: plan
        with:
          check_main_success: 'false'

      - name: Plan summary
        shell: bash
        env:
          SUMMARY_TITLE: Native build plan (main)
          AGGREGATE_DIGEST: ${{ steps.plan.outputs.aggregate_digest }}
          ALL_CACHED: ${{ steps.plan.outputs.all_cached }}
          CACHED_TARGETS_JSON: ${{ steps.plan.outputs.cached_targets }}
          REBUILT_TARGETS_JSON: ${{ steps.plan.outputs.rebuilt_targets }}
          PRODUCER_SHA: ${{ github.sha }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
        run: bash scripts/ci/write-native-ci-summary.sh

  build-linux:
    needs: [validate-package-lock, quality, build-ts, plan]
    if: |
      !cancelled() &&
      needs.validate-package-lock.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.plan.result == 'success' &&
      (
        needs.plan.outputs.linux_x64_matrix != '[]' ||
        needs.plan.outputs.build_linux_arm64 == 'true' ||
        needs.plan.outputs.build_linux_musl == 'true'
      )
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      cache_prefix: v3-release-otel
      linux_x64_matrix: ${{ needs.plan.outputs.linux_x64_matrix }}
      build_linux_arm64: ${{ needs.plan.outputs.build_linux_arm64 == 'true' }}
      build_linux_musl: ${{ needs.plan.outputs.build_linux_musl == 'true' }}
    secrets: inherit

  build-host:
    needs: [validate-package-lock, quality, build-ts, plan]
    if: |
      !cancelled() &&
      needs.validate-package-lock.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.host_matrix != '[]'
    uses: ./.github/workflows/reusable-build-host.yml
    with:
      cache_prefix: v3-release-otel
      host_matrix: ${{ needs.plan.outputs.host_matrix }}
    secrets: inherit

  stage-cached:
    needs: [validate-package-lock, quality, build-ts, plan]
    if: |
      !cancelled() &&
      needs.validate-package-lock.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.plan.result == 'success' &&
      (
        needs.plan.outputs.cached_linux_x64 != '[]' ||
        needs.plan.outputs.cached_linux_arm64 == 'true' ||
        needs.plan.outputs.cached_host != '[]'
      )
    uses: ./.github/workflows/reusable-stage-cached-bindings.yml
    with:
      cached_linux_x64: ${{ needs.plan.outputs.cached_linux_x64 }}
      cached_linux_arm64: ${{ needs.plan.outputs.cached_linux_arm64 == 'true' }}
      cached_host: ${{ needs.plan.outputs.cached_host }}
    secrets: inherit

  test:
    name: Test
    needs: [validate-package-lock, quality, build-ts, plan, build-linux, build-host, stage-cached]
    if: |
      !cancelled() &&
      needs.validate-package-lock.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.plan.result == 'success' &&
      (needs.build-ts.result == 'success' || needs.build-ts.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-host.result == 'success' || needs.build-host.result == 'skipped') &&
      (needs.stage-cached.result == 'success' || needs.stage-cached.result == 'skipped')
    uses: ./.github/workflows/reusable-test.yml
    with:
      test_script: scripts/ci/run-pr-integration.sh
      quality_result: ${{ needs.quality.result }}
      binding_artifact: bindings-x86_64-unknown-linux-gnu
      binding_profile: release
      require_binding_artifact: 'true'
      needs_native_binding: 'true'
      needs_ts_dist: 'true'
    secrets: inherit

  assemble-native-bundle:
    name: Assemble native main bundle
    needs: [plan, build-linux, build-host, stage-cached, test]
    if: |
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.test.result == 'success' &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-host.result == 'success' || needs.build-host.result == 'skipped') &&
      (needs.stage-cached.result == 'success' || needs.stage-cached.result == 'skipped')
    runs-on: self-hosted
    permissions:
      contents: read
      actions: write
    steps:
      - name: Prepare workspace
        run: |
          if [[ -n "${RUNNER_WORKSPACE:-}" && -d "${RUNNER_WORKSPACE}" ]]; then
            docker run --rm \
              -v "${RUNNER_WORKSPACE}:${RUNNER_WORKSPACE}" \
              alpine:3.20 \
              chown -R "$(id -u):$(id -g)" "${RUNNER_WORKSPACE}" || true
          fi

      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-restore-workspace-ownership

      # Bundle assembly recomputes every target fingerprint with `cargo metadata`.
      - name: Install Rust metadata toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download all binding artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts
          pattern: bindings-*
          merge-multiple: false

      - name: Assemble + validate six-target bundle
        id: bundle
        shell: bash
        env:
          NATIVE_TOOL_MODE: declared
          NATIVE_PRODUCER_GIT_SHA: ${{ github.sha }}
          NATIVE_PRODUCER_RUN_ID: ${{ github.run_id }}
          NATIVE_PRODUCER_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          mkdir -p native-main-bundle
          agg="$(bash scripts/ci/native-artifact-bundle.sh assemble \
            --artifacts-root ci-artifacts \
            --output native-main-bundle \
            --profile release)"
          bash scripts/ci/native-artifact-bundle.sh validate \
            --bundle native-main-bundle \
            --profile release
          echo "aggregate_digest=${agg}" >> "$GITHUB_OUTPUT"
          SUMMARY_TITLE="Native main bundle" \
          AGGREGATE_DIGEST="$agg" \
          PRODUCER_SHA="${{ github.sha }}" \
          PRODUCER_RUN_ID="${{ github.run_id }}" \
          FALLBACK_REASON="assembled_this_run" \
          bash scripts/ci/write-native-ci-summary.sh

      - name: Upload native-main-bundle
        uses: actions/upload-artifact@v4
        with:
          name: native-main-bundle
          path: native-main-bundle/
          if-no-files-found: error
          retention-days: 90
