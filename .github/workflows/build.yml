name: Build & Test

on:
  pull_request:
    branches: [main]

# New pushes to the same PR cancel the in-flight run and start a fresh one.
concurrency:
  group: build-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: read
  # write: same-repo PRs may save Actions caches after compile/TS/Sherpa misses.
  # Fork PRs remain low-trust — GitHub isolates fork caches from the base branch.
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CI_IMAGE: ghcr.io/${{ github.repository }}/ci-build:latest
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  OPUS_STATIC: '1'

jobs:
  # Always runs (no path filter). Catches broken lockfiles even when quality/test are skipped.
  validate-package-lock:
    name: Package-lock optional bindings
    runs-on: self-hosted
    steps:
      - name: Prepare workspace
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          declare -a roots=()
          add_root() {
            local p="${1:-}"
            [[ -n "$p" && -d "$p" ]] || return 0
            local existing
            for existing in "${roots[@]+"${roots[@]}"}"; do
              [[ "$existing" == "$p" ]] && return 0
            done
            roots+=("$p")
          }
          add_root "${RUNNER_WORKSPACE:-}"
          add_root "${GITHUB_WORKSPACE:-}"
          if [[ -n "${GITHUB_WORKSPACE:-}" ]]; then
            add_root "$(dirname "${GITHUB_WORKSPACE}")"
          fi
          if [[ ${#roots[@]} -eq 0 ]]; then
            echo "No workspace root to reset (RUNNER_WORKSPACE/GITHUB_WORKSPACE unset)."
            exit 0
          fi
          for root in "${roots[@]}"; do
            echo "Resetting permissions under ${root} (uid=${uid} gid=${gid})"
            docker run --rm \
              -v "${root}:${root}" \
              alpine:3.20 \
              sh -c "rm -rf \
                \"${root}/target\" \
                \"${root}/node_modules\" \
                \"${root}/node-webrtc-rust/target\" \
                \"${root}/node-webrtc-rust/node_modules\" \
                \"${root}/packages\"/*/node_modules \
                \"${root}/examples\"/*/node_modules \
                \"${root}/node-webrtc-rust/packages\"/*/node_modules \
                \"${root}/node-webrtc-rust/examples\"/*/node_modules \
                2>/dev/null || true; \
                chown -R ${uid}:${gid} \"${root}\""
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ./.github/actions/validate-package-lock

  changes:
    name: Detect changes
    runs-on: self-hosted
    outputs:
      code: ${{ steps.filter.outputs.code }}
      native: ${{ steps.filter.outputs.native }}
      typescript: ${{ steps.filter.outputs.typescript }}
      helpers: ${{ steps.filter.outputs.helpers }}
      examples: ${{ steps.filter.outputs.examples }}
      workflows: ${{ steps.filter.outputs.workflows }}
      workflows_native: ${{ steps.filter.outputs.workflows_native }}
      workflows_test: ${{ steps.filter.outputs.workflows_test }}
      workflows_ts: ${{ steps.filter.outputs.workflows_ts }}
      skip_test: ${{ steps.pr_gates.outputs.skip_test }}
      skip_quality: ${{ steps.pr_gates.outputs.skip_quality }}
      run_compile: ${{ steps.pr_gates.outputs.run_compile }}
      run_build_ts: ${{ steps.pr_gates.outputs.run_build_ts }}
      run_test: ${{ steps.pr_gates.outputs.run_test }}
      run_compile_native: ${{ steps.job_gates.outputs.run_compile_native }}
      run_integration_test: ${{ steps.job_gates.outputs.run_integration_test }}
      needs_native_for_test: ${{ steps.pr_gates.outputs.needs_native }}
      needs_ts_for_test: ${{ steps.pr_gates.outputs.needs_ts }}
    steps:
      - name: Prepare workspace
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          declare -a roots=()
          add_root() {
            local p="${1:-}"
            [[ -n "$p" && -d "$p" ]] || return 0
            local existing
            for existing in "${roots[@]+"${roots[@]}"}"; do
              [[ "$existing" == "$p" ]] && return 0
            done
            roots+=("$p")
          }
          add_root "${RUNNER_WORKSPACE:-}"
          add_root "${GITHUB_WORKSPACE:-}"
          if [[ -n "${GITHUB_WORKSPACE:-}" ]]; then
            add_root "$(dirname "${GITHUB_WORKSPACE}")"
          fi
          if [[ ${#roots[@]} -eq 0 ]]; then
            echo "No workspace root to reset (RUNNER_WORKSPACE/GITHUB_WORKSPACE unset)."
            exit 0
          fi
          for root in "${roots[@]}"; do
            echo "Resetting permissions under ${root} (uid=${uid} gid=${gid})"
            docker run --rm \
              -v "${root}:${root}" \
              alpine:3.20 \
              sh -c "rm -rf \
                \"${root}/target\" \
                \"${root}/node_modules\" \
                \"${root}/node-webrtc-rust/target\" \
                \"${root}/node-webrtc-rust/node_modules\" \
                \"${root}/packages\"/*/node_modules \
                \"${root}/examples\"/*/node_modules \
                \"${root}/node-webrtc-rust/packages\"/*/node_modules \
                \"${root}/node-webrtc-rust/examples\"/*/node_modules \
                2>/dev/null || true; \
                chown -R ${uid}:${gid} \"${root}\""
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
            native:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'packages/bindings/**'
              - '!**/*.md'
              - '!packages/bindings/*.node'
              - '!packages/bindings/index.d.ts'
              - '!packages/bindings/index.js'
            typescript:
              - 'packages/sdk/**'
              - 'packages/signaling/**'
              - 'packages/helpers/**'
              - 'package.json'
              - 'package-lock.json'
              - '**/tsconfig*.json'
              - 'eslint.config.js'
              - '.prettierrc*'
              - '!**/*.md'
            helpers:
              - 'packages/helpers/**'
              - 'examples/voice-agent-local-sherpa-multi-client/**'
              - '!**/*.md'
            examples:
              - 'examples/**'
              - '!**/*.md'
            workflows:
              - '.github/**'
              - 'docker/ci/**'
              - 'scripts/ci/**'
              - '!**/*.md'
            workflows_native:
              - '.github/actions/ci-build-native-*'
              - '.github/actions/native-binding-cache/**'
              - '.github/actions/plan-native-builds/**'
              - 'docker/ci/**'
              - 'scripts/ci/native-binding-cache-key.sh'
              - 'scripts/ci/native_build_contract.py'
              - 'scripts/ci/native-build-fingerprint.sh'
              - 'scripts/ci/native-artifact-*.sh'
              - 'scripts/ci/native-cache-epoch'
              - 'scripts/ci/collect-native-tool-identity.sh'
              - 'scripts/ci/write-native-artifact-manifest.sh'
              - 'scripts/ci/resolve-native-main-bundle.sh'
              - 'scripts/ci/resolve_native_main_bundle.py'
              - 'scripts/ci/plan-native-builds.sh'
              - 'scripts/ci/verify-native-binding-surface.mjs'
            workflows_test:
              - '.github/actions/ci-run-integration-tests/**'
              - '.github/actions/ci-cache-sherpa-models/**'
              - '.github/workflows/reusable-test.yml'
              - 'scripts/ci/run-pr-integration.sh'
              - 'scripts/ci/run-pr-tests-full.sh'
              - 'scripts/ci/run-sherpa-example-ci.sh'
              - 'scripts/ci/run-sherpa-roundtrip-e2e.sh'
              - 'scripts/ci/run-pr-test-job-docker.sh'
              - 'scripts/ci/compute-pr-job-gates.sh'
              - 'scripts/ci/ensure-sherpa-models.sh'
              - 'scripts/ci/validate-sherpa-model-dirs.sh'
              - 'scripts/ci/sherpa-models-cache-key.sh'
            workflows_ts:
              - '.github/actions/ci-cache-ts-dist/**'
              - 'scripts/ci/build-ts-workspace.sh'
              - 'scripts/ci/ensure-ts-dist.sh'
              - 'scripts/ci/verify-release-publish-ts.sh'
              - 'scripts/ci/ts-dist-cache-key.sh'

      - name: Compute PR job gates
        id: pr_gates
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FILTER_NATIVE: ${{ steps.filter.outputs.native }}
          FILTER_WORKFLOWS_NATIVE: ${{ steps.filter.outputs.workflows_native }}
        run: |
          bash scripts/ci/compute-pr-job-gates.sh \
            "$PR_BASE_SHA" \
            "$PR_HEAD_SHA" \
            "$FILTER_NATIVE" \
            "$FILTER_WORKFLOWS_NATIVE" >> "$GITHUB_OUTPUT"

      # Compute on the self-hosted runner (bash 5). compile-native runs inside the
      # ci-build container where `${var,,}` and other bash-4+ syntax is unavailable.
      - name: Derive compile and integration job gates
        id: job_gates
        env:
          RUN_COMPILE: ${{ steps.pr_gates.outputs.run_compile }}
          SKIP_TEST: ${{ steps.pr_gates.outputs.skip_test }}
          FILTER_NATIVE: ${{ steps.filter.outputs.native }}
          FILTER_WORKFLOWS_NATIVE: ${{ steps.filter.outputs.workflows_native }}
        run: |
          if [ "$RUN_COMPILE" = "true" ] || [ "$FILTER_NATIVE" = "true" ] || [ "$FILTER_WORKFLOWS_NATIVE" = "true" ]; then
            echo "run_compile_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_compile_native=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SKIP_TEST" != "true" ] || [ "$RUN_COMPILE" = "true" ] || [ "$FILTER_NATIVE" = "true" ]; then
            echo "run_integration_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_integration_test=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Typecheck & lint
    needs: [changes, validate-package-lock]
    if: |
      always() &&
      !cancelled() &&
      needs.validate-package-lock.result == 'success'
    runs-on: self-hosted
    outputs:
      ran_quality: ${{ steps.gate.outputs.run }}
    steps:
      - name: Skip when docs-only (no code or CI changes)
        id: gate
        run: |
          if [[ "${{ needs.changes.outputs.run_quality }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping typecheck & lint — docs-only PR (no code or CI changes)."
          fi

      - name: Prepare workspace
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          declare -a roots=()
          add_root() {
            local p="${1:-}"
            [[ -n "$p" && -d "$p" ]] || return 0
            local existing
            for existing in "${roots[@]+"${roots[@]}"}"; do
              [[ "$existing" == "$p" ]] && return 0
            done
            roots+=("$p")
          }
          add_root "${RUNNER_WORKSPACE:-}"
          add_root "${GITHUB_WORKSPACE:-}"
          if [[ -n "${GITHUB_WORKSPACE:-}" ]]; then
            add_root "$(dirname "${GITHUB_WORKSPACE}")"
          fi
          if [[ ${#roots[@]} -eq 0 ]]; then
            echo "No workspace root to reset (RUNNER_WORKSPACE/GITHUB_WORKSPACE unset)."
            exit 0
          fi
          for root in "${roots[@]}"; do
            echo "Resetting permissions under ${root} (uid=${uid} gid=${gid})"
            docker run --rm \
              -v "${root}:${root}" \
              alpine:3.20 \
              sh -c "rm -rf \
                \"${root}/target\" \
                \"${root}/node_modules\" \
                \"${root}/node-webrtc-rust/target\" \
                \"${root}/node-webrtc-rust/node_modules\" \
                \"${root}/packages\"/*/node_modules \
                \"${root}/examples\"/*/node_modules \
                \"${root}/node-webrtc-rust/packages\"/*/node_modules \
                \"${root}/node-webrtc-rust/examples\"/*/node_modules \
                2>/dev/null || true; \
                chown -R ${uid}:${gid} \"${root}\""
          done

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20

      - name: Typecheck, lint, and unit tests
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/ci/run-pr-quality.sh

  compile-native:
    name: Compile native
    needs: [changes, validate-package-lock, quality]
    if: |
      always() &&
      !cancelled() &&
      needs.validate-package-lock.result == 'success'
    runs-on: self-hosted
    outputs:
      ran_compile: ${{ steps.gate.outputs.run }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Skip when no native or native-CI changes
        id: gate
        run: |
          if [ "${{ needs.changes.outputs.run_compile_native }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping native compile — no Rust/bindings or native-build CI changes in this PR."
          fi

      - name: Require quality passed before native compile
        if: steps.gate.outputs.run == 'true' && needs.quality.outputs.ran_quality == 'true' && needs.quality.result != 'success'
        run: |
          echo "Typecheck & lint must pass before native compile (quality=${{ needs.quality.result }})." >&2
          exit 1

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      # Restore+validate (not probe-only). reusable-test is workflow_call and often
      # cannot restore GHA caches that compile can see — always artifact-handoff to Test.
      - uses: ./.github/actions/native-binding-cache
        if: steps.gate.outputs.run == 'true'
        id: native-cache
        with:
          target: x86_64-unknown-linux-gnu
          profile: debug

      - uses: ./.github/actions/ci-build-native-linux
        if: steps.gate.outputs.run == 'true'
        with:
          target: x86_64-unknown-linux-gnu
          profile: debug
          cache_prefix: v1-pr-debug
          platform: 'false'
          zig: 'false'
          skip_build_on_cache_hit: 'true'
          native_cache_hit: ${{ steps.native-cache.outputs.cache-hit }}
          binding_cache_key: ${{ steps.native-cache.outputs.cache-key }}
          upload_artifact: 'true'

  build-ts:
    name: Build TypeScript
    needs: [changes, validate-package-lock, quality]
    if: |
      always() &&
      !cancelled() &&
      needs.validate-package-lock.result == 'success'
    runs-on: self-hosted
    outputs:
      ran_build: ${{ steps.gate.outputs.run }}
    steps:
      - name: Skip when no TypeScript or TS-CI changes
        id: gate
        run: |
          if [[ "${{ needs.changes.outputs.run_build_ts }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping TypeScript build — no TS/examples or TS-build CI changes in this PR."
          fi

      - name: Require quality passed before TypeScript build
        if: steps.gate.outputs.run == 'true' && needs.quality.outputs.ran_quality == 'true' && needs.quality.result != 'success'
        run: |
          echo "Typecheck & lint must pass before TypeScript build (quality=${{ needs.quality.result }})." >&2
          exit 1

      - name: Prepare workspace
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          declare -a roots=()
          add_root() {
            local p="${1:-}"
            [[ -n "$p" && -d "$p" ]] || return 0
            local existing
            for existing in "${roots[@]+"${roots[@]}"}"; do
              [[ "$existing" == "$p" ]] && return 0
            done
            roots+=("$p")
          }
          add_root "${RUNNER_WORKSPACE:-}"
          add_root "${GITHUB_WORKSPACE:-}"
          if [[ -n "${GITHUB_WORKSPACE:-}" ]]; then
            add_root "$(dirname "${GITHUB_WORKSPACE}")"
          fi
          if [[ ${#roots[@]} -eq 0 ]]; then
            echo "No workspace root to reset (RUNNER_WORKSPACE/GITHUB_WORKSPACE unset)."
            exit 0
          fi
          for root in "${roots[@]}"; do
            echo "Resetting permissions under ${root} (uid=${uid} gid=${gid})"
            docker run --rm \
              -v "${root}:${root}" \
              alpine:3.20 \
              sh -c "rm -rf \
                \"${root}/target\" \
                \"${root}/node_modules\" \
                \"${root}/node-webrtc-rust/target\" \
                \"${root}/node-webrtc-rust/node_modules\" \
                \"${root}/packages\"/*/node_modules \
                \"${root}/examples\"/*/node_modules \
                \"${root}/node-webrtc-rust/packages\"/*/node_modules \
                \"${root}/node-webrtc-rust/examples\"/*/node_modules \
                2>/dev/null || true; \
                chown -R ${uid}:${gid} \"${root}\""
          done

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20

      - uses: ./.github/actions/ci-cache-ts-dist
        if: steps.gate.outputs.run == 'true'
        id: ts-cache
        with:
          node_major: '20'

      - name: Build TypeScript packages
        if: steps.gate.outputs.run == 'true' && steps.ts-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/ci/validate-package-lock-optional-bindings.sh
          npm ci
          bash scripts/fix-rollup-native.sh
          bash scripts/ci/build-ts-workspace.sh

  # Reusable workflow_call checks are named "<caller> / <job>" (e.g. "Integration
  # tests / Test"). Branch protection requires a check named exactly "Test"; without
  # a thin gate job PRs stick on "Expected — Waiting for status to be reported".
  integration-test:
    name: Integration tests
    needs: [changes, validate-package-lock, quality, compile-native, build-ts]
    if: |
      always() &&
      !cancelled() &&
      needs.validate-package-lock.result == 'success' &&
      needs.compile-native.result != 'failure' &&
      needs.build-ts.result != 'failure'
    uses: ./.github/workflows/reusable-test.yml
    with:
      test_script: scripts/ci/run-pr-integration.sh
      skip: ${{ needs.changes.outputs.run_integration_test != 'true' && 'true' || 'false' }}
      quality_result: ${{ needs.quality.result }}
      binding_artifact: ${{ needs.compile-native.outputs.ran_compile == 'true' && 'bindings-x86_64-unknown-linux-gnu' || '' }}
      binding_profile: debug
      require_binding_artifact: ${{ needs.compile-native.outputs.ran_compile == 'true' && 'true' || 'false' }}
      needs_native_binding: ${{ (needs.changes.outputs.run_compile_native == 'true' || needs.changes.outputs.needs_native_for_test == 'true') && 'true' || 'false' }}
      needs_ts_dist: ${{ needs.changes.outputs.needs_ts_for_test == 'true' && 'true' || 'false' }}
    secrets: inherit

  test:
    name: Test
    needs: [integration-test]
    if: always() && !cancelled()
    runs-on: self-hosted
    steps:
      - name: Require integration tests
        run: |
          result="${{ needs.integration-test.result }}"
          echo "integration-test result: ${result}"
          if [[ "${result}" == "success" ]]; then
            exit 0
          fi
          exit 1
