name: Build & Test

# Runners: ARC scale sets `nwr-small` (light jobs here) and `nwr-large` (integration, via
# reusable-test.yml), selected with the NWR_RUNNER_SMALL / NWR_RUNNER_LARGE repo variables as
# fallback (set a variable to `self-hosted` to send those jobs back to the old runners). Every
# Linux job is a `container:` job (ci-build image), so the same YAML runs on both.
# Plan: development/node-webrtc-rust/plans/2026-10-20-nwr-ci-arc-migration.md

on:
  pull_request:
    branches: [main]
  # Dispatched by release.yml `sync-main-package-lock` for the bot PR branch: events from
  # GITHUB_TOKEN never start pull_request runs, but workflow_dispatch is exempt. The run is
  # attached to the branch head SHA, so its check names satisfy the main ruleset.
  workflow_dispatch:

# One run per branch: release.yml dispatches this workflow on bot lock-sync PR branches and the
# same branch can also get pull_request runs; keying on the branch (and head repo, so fork PRs with
# the same branch name do not cancel each other) makes the newer run cancel the older one.
concurrency:
  group: build-pr-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: read
  # write: same-repo PRs may save Actions caches after compile/TS/Sherpa misses.
  # Fork PRs remain low-trust — GitHub isolates fork caches from the base branch.
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  OPUS_STATIC: '1'
  # Job pods run as root on a workspace owned by the runner user; checkout's safe.directory is temporary.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'

# Kubernetes container mode defaults run: steps to `sh -e`; the steps use bash syntax.
defaults:
  run:
    shell: bash

jobs:
  # Always runs (no path filter). Catches broken lockfiles even when quality/test are skipped.
  validate-package-lock:
    name: Package-lock optional bindings
    runs-on: ${{ vars.NWR_RUNNER_SMALL || 'nwr-small' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ./.github/actions/validate-package-lock

  changes:
    name: Detect changes
    runs-on: ${{ vars.NWR_RUNNER_SMALL || 'nwr-small' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      run_build_ts: ${{ steps.pr_gates.outputs.run_build_ts }}
      run_quality: ${{ steps.pr_gates.outputs.run_quality }}
      run_integration_test: ${{ steps.job_gates.outputs.run_integration_test }}
      needs_native_for_test: ${{ steps.pr_gates.outputs.needs_native }}
      needs_ts_for_test: ${{ steps.pr_gates.outputs.needs_ts }}
      test_suites: ${{ steps.pr_gates.outputs.test_suites }}
      run_musl_lid: ${{ steps.musl_lid_gate.outputs.run_musl_lid }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute PR job gates
        id: pr_gates
        env:
          # workflow_dispatch has no pull_request payload: diff against origin/main (full
          # clone via fetch-depth: 0) and the dispatched branch tip.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/ci/compute-pr-job-gates.sh "$PR_BASE_SHA" "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Derive integration job gate
        id: job_gates
        env:
          SKIP_TEST: ${{ steps.pr_gates.outputs.skip_test }}
        run: |
          if [ "$SKIP_TEST" != "true" ]; then
            echo "run_integration_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_integration_test=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive musl LID gate
        id: musl_lid_gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" | grep -qE '^(crates/vendor-sherpa-onnx/|crates/speech/|scripts/ci/build-sherpa-onnx-musl-libs\.sh$|[d]ocker/ci/Dockerfile\.alpine$|\.github/workflows/build\.yml$)'; then
            echo "run_musl_lid=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_musl_lid=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Typecheck & lint
    needs: [changes, validate-package-lock]
    if: |
      always() &&
      !cancelled() &&
      needs.validate-package-lock.result == 'success'
    runs-on: ${{ vars.NWR_RUNNER_SMALL || 'nwr-small' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      ran_quality: ${{ steps.gate.outputs.run }}
    steps:
      # Migration measurement: CPUs, cgroup limits and CPU model of the runner this job got.
      - name: Runner facts
        run: |
          echo "runner=${RUNNER_NAME:-unknown} nproc=$(nproc)"
          echo "cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
          grep -m1 'model name' /proc/cpuinfo || true

      - name: Skip when docs-only (no code or CI changes)
        id: gate
        run: |
          if [[ "${{ needs.changes.outputs.run_quality }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping typecheck & lint — docs-only PR (no code or CI changes)."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20

      - name: Typecheck, lint, and unit tests
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/ci/run-pr-quality.sh

      - name: Runner facts (end)
        if: always()
        run: echo "memory.peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"

  build-ts:
    name: Build TypeScript
    needs: [changes, validate-package-lock]
    if: |
      always() &&
      !cancelled() &&
      needs.validate-package-lock.result == 'success'
    runs-on: ${{ vars.NWR_RUNNER_SMALL || 'nwr-small' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      ran_build: ${{ steps.gate.outputs.run }}
    steps:
      - name: Skip when no TypeScript or TS-CI changes
        id: gate
        run: |
          if [[ "${{ needs.changes.outputs.run_build_ts }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping TypeScript build — no TS/examples or TS-build CI changes in this PR."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20

      - uses: ./.github/actions/ci-cache-ts-dist
        if: steps.gate.outputs.run == 'true'
        id: ts-cache
        with:
          node_major: '20'

      - name: Build TypeScript packages
        if: steps.gate.outputs.run == 'true' && steps.ts-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/ci/validate-package-lock-optional-bindings.sh
          npm ci
          bash scripts/fix-rollup-native.sh
          bash scripts/ci/build-ts-workspace.sh

  # Reusable workflow_call checks are named "<caller> / <job>" (e.g. "Integration
  # tests / Rust tests"). Branch protection requires a check named exactly "Test"; without
  # a thin gate job PRs stick on "Expected — Waiting for status to be reported".
  # The runner ships on musl (node:alpine, bindings-linux-x64-musl): Sherpa there links Alpine's
  # distro onnxruntime, and the LID allowed-set scorer (ort) calls into that same runtime. Run the
  # LID tests natively on x86_64 musl (real runtime, not a fake). Each test step runs even when an
  # earlier one failed, so a crash in one does not hide the next; the job fails if any fails.
  musl-lid:
    name: LID on x86_64 musl
    needs: [changes]
    if: needs.changes.outputs.run_musl_lid == 'true'
    runs-on: ${{ vars.NWR_RUNNER_LARGE || 'nwr-large' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build-alpine:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUST_BACKTRACE: '1'
      SHERPA_ONNX_LIB_DIR: /opt/sherpa-musl/lib
      LD_LIBRARY_PATH: /opt/sherpa-musl/lib:/usr/lib
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ram-target-dir

      - name: Alpine onnxruntime version
        run: |
          apk info -v onnxruntime
          apk list --installed 2>/dev/null | grep onnxruntime

      - name: Ensure Sherpa ONNX musl shared libs
        run: bash scripts/ci/build-sherpa-onnx-musl-libs.sh

      - name: Ensure Sherpa models (Whisper tiny LID)
        run: |
          # ci-step.sh uses GNU `timeout --foreground`; BusyBox timeout has no such option.
          apk add --no-cache coreutils >/dev/null
          bash scripts/ci/ensure-sherpa-models.sh
          echo "SHERPA_LID_MODEL_PATH=$GITHUB_WORKSPACE/examples/voice-agent-local-sherpa/.models/sherpa-onnx-whisper-tiny" >> "$GITHUB_ENV"

      - name: Install gdb (native stack on a crash)
        run: apk add --no-cache gdb binutils >/dev/null && gdb --version | head -1

      - name: Build LID test binaries (release)
        run: |
          cargo test -p node-webrtc-rust-vendor-sherpa-onnx --release --no-run --message-format=json \
            --test lid_shared_model_test --test lid_allowed_set_test --lib \
            | grep -o '"executable":"[^"]*"' | sed 's/"executable":"\(.*\)"/\1/' > lid-test-bins.txt
          cat lid-test-bins.txt
          echo "LID_CONTROL_BIN=$(grep '/release/deps/lid_shared_model_test-' lid-test-bins.txt | tail -1)" >> "$GITHUB_ENV"

      # Confirm step: which ONNX Runtime symbols the test binary defines or imports, and where the
      # dynamic loader binds OrtGetApiBase. An Ort* symbol defined in the executable interposes the
      # one in libonnxruntime.so that libsherpa-onnx-c-api.so uses.
      - name: (diag) Ort symbols in the control binary
        if: always()
        run: |
          echo "--- nm -D --defined-only | Ort"; nm -D --defined-only "$LID_CONTROL_BIN" | grep -i ' Ort' || echo none
          echo "--- nm (all) | OrtGetApiBase"; nm "$LID_CONTROL_BIN" | grep -i 'OrtGetApiBase' || echo none
          echo "--- nm -D --undefined-only | Ort"; nm -D --undefined-only "$LID_CONTROL_BIN" | grep -i ' Ort' || echo none
          echo "--- NEEDED"; readelf -d "$LID_CONTROL_BIN" | grep NEEDED || true
          echo "--- ldd"; ldd "$LID_CONTROL_BIN" || true
          for so in /opt/sherpa-musl/lib/libsherpa-onnx-c-api.so /usr/lib/libonnxruntime.so.1; do
            echo "--- $so NEEDED"; readelf -d "$so" | grep NEEDED || true
            echo "--- $so OrtGetApiBase"; nm -D "$so" | grep OrtGetApiBase || echo none
          done

      # Which libonnxruntime.so.1 the job loads: the copy installed into /opt/sherpa-musl/lib or
      # Alpine's /usr/lib one sherpa was compiled against (headers in /usr/include/onnxruntime).
      - name: (diag) onnxruntime copies and versions
        if: always()
        run: |
          ls -l /opt/sherpa-musl/lib/libonnxruntime* /usr/lib/libonnxruntime* || true
          for so in /opt/sherpa-musl/lib/libonnxruntime.so.1 /usr/lib/libonnxruntime.so.1; do
            echo "--- $so"; readlink -f "$so" || true
            readelf -d "$so" | grep SONAME || true
            nm -D "$so" | grep OrtGetApiBase || echo "no OrtGetApiBase"
            strings "$so" | grep -m3 -E '^1\.[0-9]+\.[0-9]+$' || true
          done
          cmp /opt/sherpa-musl/lib/libonnxruntime.so.1 /usr/lib/libonnxruntime.so.1 && echo "cmp: identical" || echo "cmp: differ"
          grep -n 'define ORT_API_VERSION' /usr/include/onnxruntime/onnxruntime_c_api.h || true
          apk info -v onnxruntime onnxruntime-dev || true

      - name: (diag) control, release, LD_LIBRARY_PATH=/usr/lib first
        if: always()
        env:
          LD_LIBRARY_PATH: /usr/lib:/opt/sherpa-musl/lib
        run: |
          ldd "$LID_CONTROL_BIN" | grep -E 'onnxruntime|sherpa'
          "$LID_CONTROL_BIN" --ignored --nocapture --test-threads=1

      - name: (diag) b and c, release, LD_LIBRARY_PATH=/usr/lib first
        if: always()
        env:
          LD_LIBRARY_PATH: /usr/lib:/opt/sherpa-musl/lib
        run: |
          cargo test -p node-webrtc-rust-vendor-sherpa-onnx --release --test lid_allowed_set_test -- \
            --ignored --nocapture --test-threads=1
          cargo test -p node-webrtc-rust-vendor-sherpa-onnx --release --lib lid::tests -- \
            --ignored --nocapture --test-threads=1

      # The shipped musl .node (as the runner image installs it from npm) and this branch's build:
      # which libonnxruntime they need and whether they import or define OrtGetApiBase.
      - name: (diag) shipped and branch musl .node linkage
        if: always()
        run: |
          mkdir -p /tmp/shipped && cd /tmp/shipped
          npm pack @node-webrtc-rust/bindings-linux-x64-musl@latest >/dev/null 2>&1 && tar xzf ./*.tgz
          node_file=$(find /tmp/shipped -name '*.node' | head -1)
          echo "--- shipped: $node_file"
          readelf -d "$node_file" | grep -E 'NEEDED|RPATH|RUNPATH' || true
          ldd "$node_file" | grep -E 'onnxruntime|sherpa' || true
          nm -D "$node_file" | grep -E ' Ort' || echo "no Ort symbols"
          cd "$GITHUB_WORKSPACE"
          cargo build -p node-webrtc-rust-bindings --release --features silero-vad
          so=$(ls target/release/libnode_webrtc_rust_bindings.so)
          echo "--- branch: $so"
          readelf -d "$so" | grep -E 'NEEDED|RPATH|RUNPATH' || true
          ldd "$so" | grep -E 'onnxruntime|sherpa' || true
          nm -D "$so" | grep -E ' Ort' || echo "no Ort symbols"

      - name: (a) control, release, under gdb
        if: always()
        run: |
          gdb -batch -ex run -ex bt -ex 'info sharedlibrary' -return-child-result \
            --args "$LID_CONTROL_BIN" --ignored --nocapture --test-threads=1

      # Confirm step: the same control on origin/main crates (no ort alternative-backend in the graph).
      - name: (diag) control on origin/main crates, release
        if: always()
        run: |
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach /tmp/nwr-main origin/main
          cd /tmp/nwr-main
          cargo test -p node-webrtc-rust-vendor-sherpa-onnx --release --test lid_shared_model_test -- \
            --ignored --nocapture --test-threads=1

      - name: (b) allowed-set scorer on fixtures, release
        if: always()
        run: |
          cargo test -p node-webrtc-rust-vendor-sherpa-onnx --release --test lid_allowed_set_test -- \
            --ignored --nocapture --test-threads=1

      - name: (c) scorer failure falls back to sherpa, release
        if: always()
        run: |
          cargo test -p node-webrtc-rust-vendor-sherpa-onnx --release --lib lid::tests -- \
            --ignored --nocapture --test-threads=1

  integration-test:
    name: Integration tests
    # Does not wait for build-ts: run-pr-integration.sh builds the TS dist itself on a cache miss
    # (ensure-ts-dist.sh), and on the 1-CPU nwr-small build-ts took 160 s on the critical path.
    # The Test gate still requires build-ts.
    needs: [changes, validate-package-lock]
    if: |
      always() &&
      !cancelled() &&
      needs.validate-package-lock.result == 'success'
    uses: ./.github/workflows/reusable-test.yml
    with:
      test_script: scripts/ci/run-pr-integration.sh
      skip: ${{ needs.changes.outputs.run_integration_test != 'true' && 'true' || 'false' }}
      needs_native_binding: ${{ needs.changes.outputs.needs_native_for_test == 'true' && 'true' || 'false' }}
      needs_ts_dist: ${{ needs.changes.outputs.needs_ts_for_test == 'true' && 'true' || 'false' }}
      test_suites: ${{ needs.changes.outputs.test_suites }}
    secrets: inherit

  test:
    name: Test
    needs: [quality, build-ts, integration-test]
    if: always() && !cancelled()
    runs-on: ${{ vars.NWR_RUNNER_SMALL || 'nwr-small' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require lint, TypeScript build and integration tests
        run: |
          quality="${{ needs.quality.result }}"
          build_ts="${{ needs.build-ts.result }}"
          integration="${{ needs.integration-test.result }}"
          echo "quality result: ${quality}"
          echo "build-ts result: ${build_ts}"
          echo "integration-test result: ${integration}"
          # quality always runs and reports success when its gate skips the work.
          if [[ "${quality}" == "success" && ( "${build_ts}" == "success" || "${build_ts}" == "skipped" ) && "${integration}" == "success" ]]; then
            exit 0
          fi
          exit 1
