name: Build & Test

# Runners: ARC scale sets `nwr-small` (light jobs here) and `nwr-large` (integration, via
# reusable-test.yml), selected with the NWR_RUNNER_SMALL / NWR_RUNNER_LARGE repo variables as
# fallback (set a variable to `self-hosted` to send those jobs back to the old runners). Every
# Linux job is a `container:` job (ci-build image), so the same YAML runs on both.
# Plan: development/node-webrtc-rust/plans/2026-10-20-nwr-ci-arc-migration.md

on:
  pull_request:
    branches: [main]
  # Dispatched by release.yml `sync-main-package-lock` for the bot PR branch: events from
  # GITHUB_TOKEN never start pull_request runs, but workflow_dispatch is exempt. The run is
  # attached to the branch head SHA, so its check names satisfy the main ruleset.
  workflow_dispatch:

# One run per branch: release.yml dispatches this workflow on bot lock-sync PR branches and the
# same branch can also get pull_request runs; keying on the branch (and head repo, so fork PRs with
# the same branch name do not cancel each other) makes the newer run cancel the older one.
concurrency:
  group: build-pr-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: read
  # write: same-repo PRs may save Actions caches after compile/TS/Sherpa misses.
  # Fork PRs remain low-trust — GitHub isolates fork caches from the base branch.
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  OPUS_STATIC: '1'
  # Job pods run as root on a workspace owned by the runner user; checkout's safe.directory is temporary.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'

# Kubernetes container mode defaults run: steps to `sh -e`; the steps use bash syntax.
defaults:
  run:
    shell: bash

jobs:
  # Always runs (no path filter). Catches broken lockfiles even when quality/test are skipped.
  validate-package-lock:
    name: Package-lock optional bindings
    runs-on: ${{ vars.NWR_RUNNER_SMALL || 'nwr-small' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ./.github/actions/validate-package-lock

  changes:
    name: Detect changes
    runs-on: ${{ vars.NWR_RUNNER_SMALL || 'nwr-small' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      run_build_ts: ${{ steps.pr_gates.outputs.run_build_ts }}
      run_quality: ${{ steps.pr_gates.outputs.run_quality }}
      run_integration_test: ${{ steps.job_gates.outputs.run_integration_test }}
      needs_native_for_test: ${{ steps.pr_gates.outputs.needs_native }}
      needs_ts_for_test: ${{ steps.pr_gates.outputs.needs_ts }}
      test_suites: ${{ steps.pr_gates.outputs.test_suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute PR job gates
        id: pr_gates
        env:
          # workflow_dispatch has no pull_request payload: diff against origin/main (full
          # clone via fetch-depth: 0) and the dispatched branch tip.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/ci/compute-pr-job-gates.sh "$PR_BASE_SHA" "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Derive integration job gate
        id: job_gates
        env:
          SKIP_TEST: ${{ steps.pr_gates.outputs.skip_test }}
        run: |
          if [ "$SKIP_TEST" != "true" ]; then
            echo "run_integration_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_integration_test=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Typecheck & lint
    needs: [changes, validate-package-lock]
    if: |
      always() &&
      !cancelled() &&
      needs.validate-package-lock.result == 'success'
    runs-on: ${{ vars.NWR_RUNNER_SMALL || 'nwr-small' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      ran_quality: ${{ steps.gate.outputs.run }}
    steps:
      # Migration measurement: CPUs, cgroup limits and CPU model of the runner this job got.
      - name: Runner facts
        run: |
          echo "runner=${RUNNER_NAME:-unknown} nproc=$(nproc)"
          echo "cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
          grep -m1 'model name' /proc/cpuinfo || true

      - name: Skip when docs-only (no code or CI changes)
        id: gate
        run: |
          if [[ "${{ needs.changes.outputs.run_quality }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping typecheck & lint — docs-only PR (no code or CI changes)."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20

      - name: Typecheck, lint, and unit tests
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/ci/run-pr-quality.sh

      - name: Runner facts (end)
        if: always()
        run: echo "memory.peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"

  build-ts:
    name: Build TypeScript
    needs: [changes, validate-package-lock]
    if: |
      always() &&
      !cancelled() &&
      needs.validate-package-lock.result == 'success'
    runs-on: ${{ vars.NWR_RUNNER_SMALL || 'nwr-small' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      ran_build: ${{ steps.gate.outputs.run }}
    steps:
      - name: Skip when no TypeScript or TS-CI changes
        id: gate
        run: |
          if [[ "${{ needs.changes.outputs.run_build_ts }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping TypeScript build — no TS/examples or TS-build CI changes in this PR."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20

      - uses: ./.github/actions/ci-cache-ts-dist
        if: steps.gate.outputs.run == 'true'
        id: ts-cache
        with:
          node_major: '20'

      - name: Build TypeScript packages
        if: steps.gate.outputs.run == 'true' && steps.ts-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/ci/validate-package-lock-optional-bindings.sh
          npm ci
          bash scripts/fix-rollup-native.sh
          bash scripts/ci/build-ts-workspace.sh

  # Reusable workflow_call checks are named "<caller> / <job>" (e.g. "Integration
  # tests / Test"). Branch protection requires a check named exactly "Test"; without
  # a thin gate job PRs stick on "Expected — Waiting for status to be reported".
  integration-test:
    name: Integration tests
    needs: [changes, validate-package-lock, build-ts]
    if: |
      always() &&
      !cancelled() &&
      needs.validate-package-lock.result == 'success' &&
      needs.build-ts.result != 'failure'
    uses: ./.github/workflows/reusable-test.yml
    with:
      test_script: scripts/ci/run-pr-integration.sh
      skip: ${{ needs.changes.outputs.run_integration_test != 'true' && 'true' || 'false' }}
      needs_native_binding: ${{ needs.changes.outputs.needs_native_for_test == 'true' && 'true' || 'false' }}
      needs_ts_dist: ${{ needs.changes.outputs.needs_ts_for_test == 'true' && 'true' || 'false' }}
      test_suites: ${{ needs.changes.outputs.test_suites }}
    secrets: inherit

  test:
    name: Test
    needs: [quality, build-ts, integration-test]
    if: always() && !cancelled()
    runs-on: ${{ vars.NWR_RUNNER_SMALL || 'nwr-small' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require lint, TypeScript build and integration tests
        run: |
          quality="${{ needs.quality.result }}"
          build_ts="${{ needs.build-ts.result }}"
          integration="${{ needs.integration-test.result }}"
          echo "quality result: ${quality}"
          echo "build-ts result: ${build_ts}"
          echo "integration-test result: ${integration}"
          # quality always runs and reports success when its gate skips the work.
          if [[ "${quality}" == "success" && ( "${build_ts}" == "success" || "${build_ts}" == "skipped" ) && "${integration}" == "success" ]]; then
            exit 0
          fi
          exit 1
