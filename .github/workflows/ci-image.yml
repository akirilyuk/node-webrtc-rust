name: CI Docker image

# Rebuild and publish CI containers from the `ci` branch (or `main` when Dockerfiles change).
# PRs touching the image inputs get a build-only check (nothing is pushed).
# `ci-test` is `ci-build` + coturn + Sherpa model weights (docker/ci/Dockerfile.test); it is
# not a native fingerprint input, so it has no content digest.
# Workflows may pull `:latest` for convenience, but native fingerprints use content/@sha256
# image contracts — never treat mutable `latest` as identity.

on:
  push:
    branches: [ci, main]
    paths:
      - 'docker/ci/**'
      - 'scripts/ci/install-alpine-native-toolchain.sh'
      - 'scripts/ci/build-sherpa-onnx-musl-libs.sh'
      - 'scripts/ci/ci-image-content-digest.sh'
      - 'examples/shared/sherpa-local-model-catalog.json'
      - 'examples/shared/sherpa-tts-model-catalog.json'
      - 'examples/voice-agent-local-sherpa/scripts/download-stt.mjs'
      - 'examples/voice-agent-local-sherpa/scripts/download-tts.mjs'
      - 'examples/voice-agent-local-sherpa/scripts/download-lid.mjs'
      - 'examples/voice-agent-local-sherpa/scripts/sherpa-model-catalog.mjs'
      - 'examples/voice-agent-local-sherpa/scripts/sherpa-tts-model-catalog.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'docker/ci/**'
      - 'scripts/ci/install-alpine-native-toolchain.sh'
      - 'scripts/ci/build-sherpa-onnx-musl-libs.sh'
      - 'scripts/ci/ci-image-content-digest.sh'
      - 'examples/shared/sherpa-local-model-catalog.json'
      - 'examples/shared/sherpa-tts-model-catalog.json'
      - 'examples/voice-agent-local-sherpa/scripts/download-stt.mjs'
      - 'examples/voice-agent-local-sherpa/scripts/download-tts.mjs'
      - 'examples/voice-agent-local-sherpa/scripts/download-lid.mjs'
      - 'examples/voice-agent-local-sherpa/scripts/sherpa-model-catalog.mjs'
      - 'examples/voice-agent-local-sherpa/scripts/sherpa-tts-model-catalog.mjs'
  workflow_dispatch:

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: ghcr.io/${{ github.repository }}/ci-build:latest
  CI_ALPINE_IMAGE: ghcr.io/${{ github.repository }}/ci-build-alpine:latest
  CI_IMAGE_SHA: ghcr.io/${{ github.repository }}/ci-build:${{ github.sha }}
  CI_ALPINE_IMAGE_SHA: ghcr.io/${{ github.repository }}/ci-build-alpine:${{ github.sha }}
  CI_TEST_IMAGE: ghcr.io/${{ github.repository }}/ci-test:latest
  CI_TEST_IMAGE_SHA: ghcr.io/${{ github.repository }}/ci-test:${{ github.sha }}

jobs:
  build-and-push:
    name: Build and push CI image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      glibc_digest: ${{ steps.meta.outputs.glibc_digest }}
      alpine_digest: ${{ steps.meta.outputs.alpine_digest }}
      test_digest: ${{ steps.meta.outputs.test_digest }}
      glibc_content: ${{ steps.meta.outputs.glibc_content }}
      alpine_content: ${{ steps.meta.outputs.alpine_content }}
    steps:
      - name: Prepare workspace
        run: |
          if [[ -n "${RUNNER_WORKSPACE:-}" && -d "${RUNNER_WORKSPACE}" ]]; then
            docker run --rm \
              -v "${RUNNER_WORKSPACE}:${RUNNER_WORKSPACE}" \
              alpine:3.20 \
              chown -R "$(id -u):$(id -g)" "${RUNNER_WORKSPACE}" || true
          fi

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image (glibc)
        id: glibc
        uses: docker/build-push-action@v6
        with:
          context: docker/ci
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.CI_IMAGE }}
            ${{ env.CI_IMAGE_SHA }}
          cache-from: type=gha,scope=ci-build-glibc
          cache-to: type=gha,mode=max,scope=ci-build-glibc

      - name: Build and push Alpine CI image
        id: alpine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci/Dockerfile.alpine
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.CI_ALPINE_IMAGE }}
            ${{ env.CI_ALPINE_IMAGE_SHA }}
          cache-from: type=gha,scope=ci-build-alpine
          cache-to: type=gha,mode=max,scope=ci-build-alpine

      - name: Build and push CI test image (models + coturn)
        id: test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci/Dockerfile.test
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            CI_BUILD_IMAGE=${{ github.event_name == 'pull_request' && env.CI_IMAGE || env.CI_IMAGE_SHA }}
          tags: |
            ${{ env.CI_TEST_IMAGE }}
            ${{ env.CI_TEST_IMAGE_SHA }}
          cache-from: type=gha,scope=ci-test
          cache-to: type=gha,mode=max,scope=ci-test

      - name: Record image contract
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          glibc_content="$(bash scripts/ci/ci-image-content-digest.sh glibc)"
          alpine_content="$(bash scripts/ci/ci-image-content-digest.sh alpine)"
          glibc_digest="${{ steps.glibc.outputs.digest }}"
          alpine_digest="${{ steps.alpine.outputs.digest }}"
          test_digest="${{ steps.test.outputs.digest }}"
          echo "glibc_content=${glibc_content}" >> "$GITHUB_OUTPUT"
          echo "alpine_content=${alpine_content}" >> "$GITHUB_OUTPUT"
          echo "glibc_digest=${glibc_digest}" >> "$GITHUB_OUTPUT"
          echo "alpine_digest=${alpine_digest}" >> "$GITHUB_OUTPUT"
          echo "test_digest=${test_digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## CI image contract"
            echo ""
            echo "- glibc_sha_tag: \`${{ env.CI_IMAGE_SHA }}\`"
            echo "- glibc_digest: \`${glibc_digest}\`"
            echo "- glibc_content: \`${glibc_content}\`"
            echo "- alpine_sha_tag: \`${{ env.CI_ALPINE_IMAGE_SHA }}\`"
            echo "- alpine_digest: \`${alpine_digest}\`"
            echo "- alpine_content: \`${alpine_content}\`"
            echo "- test_sha_tag: \`${{ env.CI_TEST_IMAGE_SHA }}\`"
            echo "- test_digest: \`${test_digest}\`"
            echo "- note: \`latest\` is convenience-only; native digests use content/@sha256"
          } >> "$GITHUB_STEP_SUMMARY"
