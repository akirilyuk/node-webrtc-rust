name: Reusable — stage cached binding artifacts

on:
  workflow_call:
    inputs:
      cached_linux_x64:
        description: JSON array of linux x64 triples to restore from cache
        type: string
        default: '[]'
      cached_linux_arm64:
        description: Stage aarch64-unknown-linux-gnu from cache
        type: boolean
        default: false
      cached_host:
        description: JSON array of macOS/Windows triples to restore from cache
        type: string
        default: '[]'
      profile:
        description: Native cache profile
        type: string
        default: release

jobs:
  stage-linux-x64:
    name: Stage cache - ${{ matrix.target }}
    if: inputs.cached_linux_x64 != '[]' && inputs.cached_linux_x64 != ''
    runs-on: self-hosted
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.cached_linux_x64) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/native-binding-cache
        id: native-cache
        with:
          target: ${{ matrix.target }}
          profile: ${{ inputs.profile }}

      - name: Require cached native artifact + manifest
        shell: bash
        env:
          NATIVE_TOOL_MODE: declared
          NATIVE_PRODUCER_GIT_SHA: ${{ github.sha }}
          NATIVE_PRODUCER_RUN_ID: ${{ github.run_id }}
          NATIVE_PRODUCER_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(packages/bindings/*.node)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "Expected cached .node for ${{ matrix.target }} (exact key restore failed)." >&2
            exit 1
          fi
          if [[ "${{ steps.native-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "Cache reported miss while staging ${{ matrix.target }} — failing closed." >&2
            exit 1
          fi
          bash scripts/ci/write-native-artifact-manifest.sh \
            --target "${{ matrix.target }}" \
            --profile "${{ inputs.profile }}"
          dest="ci-native-out/bindings-${{ matrix.target }}"
          mkdir -p "$dest"
          cp packages/bindings/*.node "$dest/"
          cp "packages/bindings/native-manifests/${{ matrix.target }}.json" "$dest/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: ci-native-out/bindings-${{ matrix.target }}/
          if-no-files-found: error

  stage-linux-arm64:
    name: Stage cache - aarch64-unknown-linux-gnu
    if: inputs.cached_linux_arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/native-binding-cache
        id: native-cache
        with:
          target: aarch64-unknown-linux-gnu
          profile: ${{ inputs.profile }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require cached native artifact + manifest
        shell: bash
        env:
          NATIVE_TOOL_MODE: declared
          NATIVE_PRODUCER_GIT_SHA: ${{ github.sha }}
          NATIVE_PRODUCER_RUN_ID: ${{ github.run_id }}
          NATIVE_PRODUCER_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(packages/bindings/*.node)
          if [[ ${#files[@]} -eq 0 || "${{ steps.native-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "Expected cached .node for aarch64-unknown-linux-gnu." >&2
            exit 1
          fi
          bash scripts/ci/write-native-artifact-manifest.sh \
            --target aarch64-unknown-linux-gnu \
            --profile "${{ inputs.profile }}"
          dest="ci-native-out/bindings-aarch64-unknown-linux-gnu"
          mkdir -p "$dest"
          cp packages/bindings/*.node "$dest/"
          cp packages/bindings/native-manifests/aarch64-unknown-linux-gnu.json "$dest/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-aarch64-unknown-linux-gnu
          path: ci-native-out/bindings-aarch64-unknown-linux-gnu/
          if-no-files-found: error

  stage-host:
    name: Stage cache - ${{ matrix.target }}
    if: inputs.cached_host != '[]' && inputs.cached_host != ''
    runs-on: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'windows-latest' || 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.cached_host) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/native-binding-cache
        id: native-cache
        with:
          target: ${{ matrix.target }}
          profile: ${{ inputs.profile }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require cached native artifact + manifest
        shell: bash
        env:
          NATIVE_TOOL_MODE: declared
          NATIVE_PRODUCER_GIT_SHA: ${{ github.sha }}
          NATIVE_PRODUCER_RUN_ID: ${{ github.run_id }}
          NATIVE_PRODUCER_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(packages/bindings/*.node)
          if [[ ${#files[@]} -eq 0 || "${{ steps.native-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "Expected cached .node for ${{ matrix.target }}." >&2
            exit 1
          fi
          bash scripts/ci/write-native-artifact-manifest.sh \
            --target "${{ matrix.target }}" \
            --profile "${{ inputs.profile }}"
          dest="ci-native-out/bindings-${{ matrix.target }}"
          mkdir -p "$dest"
          cp packages/bindings/*.node "$dest/"
          cp "packages/bindings/native-manifests/${{ matrix.target }}.json" "$dest/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: ci-native-out/bindings-${{ matrix.target }}/
          if-no-files-found: error
