name: Reusable — integration tests (host Docker + coturn)

on:
  workflow_call:
    inputs:
      test_script:
        description: Bash script path under repo root
        type: string
        required: true
      skip:
        description: When 'true', exit immediately (docs-only / CI-only skip gates) — job still succeeds for required checks
        type: string
        default: 'false'
      quality_result:
        description: Result of the Typecheck & lint job (success required when skip is false)
        type: string
        default: skipped
      binding_artifact:
        description: Uploaded .node artifact from compile/build-linux (skip download when empty)
        type: string
        default: ''
      binding_profile:
        description: native-binding-cache profile when artifact download is skipped
        type: string
        default: debug
      require_binding_artifact:
        description: Fail when the binding artifact is missing (compile/build-linux ran)
        type: string
        default: 'false'
      needs_native_binding:
        description: When 'true', restore/verify .node before integration tests
        type: string
        default: 'false'
      needs_ts_dist:
        description: When 'true', restore TS dist cache before integration tests
        type: string
        default: 'false'
      ts_dist_profile:
        description: ci-cache-ts-dist profile namespace (pr or release)
        type: string
        default: release

jobs:
  test:
    name: Test
    runs-on: self-hosted
    env:
      TURN_AVAILABLE: '1'
      CI_IMAGE: ghcr.io/${{ github.repository }}/ci-build:latest
    steps:
      # workflow_call coerces booleans; normalize once in bash for reliable step if: gates.
      - name: Resolve integration test gates
        id: gate
        env:
          SKIP: ${{ inputs.skip }}
          NEEDS_NATIVE: ${{ inputs.needs_native_binding }}
          NEEDS_TS: ${{ inputs.needs_ts_dist }}
        run: |
          is_true() {
            case "$1" in
              true|True|TRUE|1|yes|Yes|YES) return 0 ;;
              *) return 1 ;;
            esac
          }
          if is_true "$SKIP"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping integration tests — no source code changes in this PR."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if is_true "$NEEDS_NATIVE"; then
            echo "needs_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_native=false" >> "$GITHUB_OUTPUT"
          fi
          if is_true "$NEEDS_TS"; then
            echo "needs_ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_ts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require quality passed before integration tests
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.needs_native == 'true' && inputs.quality_result != 'success'
        run: |
          echo "Typecheck & lint must pass before integration tests (quality=${{ inputs.quality_result }})." >&2
          exit 1

      - name: Prepare workspace
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          declare -a roots=()
          add_root() {
            local p="${1:-}"
            [[ -n "$p" && -d "$p" ]] || return 0
            local existing
            for existing in "${roots[@]+"${roots[@]}"}"; do
              [[ "$existing" == "$p" ]] && return 0
            done
            roots+=("$p")
          }
          add_root "${RUNNER_WORKSPACE:-}"
          add_root "${GITHUB_WORKSPACE:-}"
          if [[ -n "${GITHUB_WORKSPACE:-}" ]]; then
            add_root "$(dirname "${GITHUB_WORKSPACE}")"
          fi
          if [[ ${#roots[@]} -eq 0 ]]; then
            echo "No workspace root to reset (RUNNER_WORKSPACE/GITHUB_WORKSPACE unset)."
            exit 0
          fi
          for root in "${roots[@]}"; do
            echo "Resetting permissions under ${root} (uid=${uid} gid=${gid})"
            docker run --rm \
              -v "${root}:${root}" \
              alpine:3.20 \
              sh -c "rm -rf \
                \"${root}/target\" \
                \"${root}/node_modules\" \
                \"${root}/node-webrtc-rust/target\" \
                \"${root}/node-webrtc-rust/node_modules\" \
                \"${root}/packages\"/*/node_modules \
                \"${root}/examples\"/*/node_modules \
                \"${root}/node-webrtc-rust/packages\"/*/node_modules \
                \"${root}/node-webrtc-rust/examples\"/*/node_modules \
                2>/dev/null || true; \
                chown -R ${uid}:${gid} \"${root}\""
          done

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Download native binding artifact
        id: binding-artifact
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.needs_native == 'true' && inputs.binding_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binding_artifact }}
          path: packages/bindings
        continue-on-error: ${{ inputs.require_binding_artifact != 'true' }}

      # GHA cache restore often misses in workflow_call jobs even after a hit in the
      # caller (compile-native). Artifact download is the reliable same-run path.
      - uses: ./.github/actions/native-binding-cache
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.needs_native == 'true' && (inputs.binding_artifact == '' || steps.binding-artifact.outcome == 'failure')
        with:
          target: x86_64-unknown-linux-gnu
          profile: ${{ inputs.binding_profile }}

      - name: Verify native binding in workspace
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.needs_native == 'true'
        run: |
          shopt -s nullglob
          files=(packages/bindings/*.node)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No .node in packages/bindings after artifact/cache restore." >&2
            exit 1
          fi
          echo "Native binding ready: $(basename "${files[0]}")"

      - uses: ./.github/actions/ci-cache-ts-dist
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.needs_ts == 'true'
        id: ts-cache
        with:
          profile: ${{ inputs.ts_dist_profile }}

      - uses: ./.github/actions/ci-run-integration-tests
        if: steps.gate.outputs.skip != 'true'
        with:
          test_script: ${{ inputs.test_script }}
          ci_image: ${{ env.CI_IMAGE }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ts_dist_cache_hit: ${{ steps.ts-cache.outputs.cache-hit || 'false' }}
