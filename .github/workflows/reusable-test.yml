name: Reusable — integration tests (ci-test container, coturn in-process)

on:
  workflow_call:
    inputs:
      test_script:
        description: Bash script path under repo root
        type: string
        required: true
      skip:
        description: When 'true', exit immediately (docs-only / CI-only skip gates) — job still succeeds for required checks
        type: string
        default: 'false'
      binding_artifact:
        description: Uploaded .node artifact from compile/build-linux (skip download when empty)
        type: string
        default: ''
      require_binding_artifact:
        description: Fail when the binding artifact is missing (compile/build-linux ran)
        type: string
        default: 'false'
      needs_native_binding:
        description: When 'true', restore/verify .node before integration tests
        type: string
        default: 'false'
      needs_ts_dist:
        description: When 'true', restore TS dist cache before integration tests
        type: string
        default: 'false'

jobs:
  test:
    name: Test
    runs-on: self-hosted
    container:
      image: ghcr.io/${{ github.repository }}/ci-test:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TURN_AVAILABLE: '1'
      CI: 'true'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      OPUS_STATIC: '1'
    steps:
      # workflow_call coerces booleans; normalize once in bash for reliable step if: gates.
      - name: Resolve integration test gates
        id: gate
        env:
          SKIP: ${{ inputs.skip }}
          NEEDS_NATIVE: ${{ inputs.needs_native_binding }}
          NEEDS_TS: ${{ inputs.needs_ts_dist }}
        run: |
          is_true() {
            case "$1" in
              true|True|TRUE|1|yes|Yes|YES) return 0 ;;
              *) return 1 ;;
            esac
          }
          if is_true "$SKIP"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping integration tests — no source code changes in this PR."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if is_true "$NEEDS_NATIVE"; then
            echo "needs_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_native=false" >> "$GITHUB_OUTPUT"
          fi
          if is_true "$NEEDS_TS"; then
            echo "needs_ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_ts=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Download native binding artifact
        id: binding-artifact
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.needs_native == 'true' && inputs.binding_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binding_artifact }}
          path: ci-binding-artifact
        continue-on-error: ${{ inputs.require_binding_artifact != 'true' }}

      - name: Stage downloaded .node into packages/bindings
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.needs_native == 'true' && inputs.binding_artifact != '' && steps.binding-artifact.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          # Supports flat (*.node) and directory (bindings-*/ *.node) artifact layouts.
          nodes=(ci-binding-artifact/*.node ci-binding-artifact/**/*.node)
          if [[ ${#nodes[@]} -eq 0 ]]; then
            echo "Downloaded artifact had no .node files" >&2
            exit 1
          fi
          cp "${nodes[0]}" packages/bindings/

      - uses: ./.github/actions/ci-cache-ts-dist
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.needs_ts == 'true'
        id: ts-cache
        with:
          node_major: '20'

      - name: Run integration tests (ci-test container, coturn in-process)
        id: integration
        if: steps.gate.outputs.skip != 'true'
        env:
          TS_DIST_CACHE_HIT: ${{ steps.ts-cache.outputs.cache-hit || 'false' }}
        run: bash "${{ inputs.test_script }}"

      # Native DTLS/ICE trace written by scripts/ci/run-pr-integration.sh. The script deletes the
      # directory when the helpers integration step passes, so files exist only after that step failed.
      - name: Upload native trace (helpers integration failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-trace-${{ github.run_id }}
          path: .test-logs/native-trace
          if-no-files-found: ignore
          retention-days: 7
