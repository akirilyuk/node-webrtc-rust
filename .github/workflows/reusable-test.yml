name: Reusable — integration tests (ci-test container, coturn in-process)

on:
  workflow_call:
    inputs:
      test_script:
        description: Bash script path under repo root
        type: string
        required: true
      skip:
        description: When 'true', exit immediately (docs-only / CI-only skip gates) — job still succeeds for required checks
        type: string
        default: 'false'
      binding_artifact:
        description: Uploaded .node artifact from compile/build-linux (skip download when empty)
        type: string
        default: ''
      require_binding_artifact:
        description: Fail when the binding artifact is missing (compile/build-linux ran)
        type: string
        default: 'false'
      needs_native_binding:
        description: When 'true', restore/verify .node before integration tests
        type: string
        default: 'false'
      needs_ts_dist:
        description: When 'true', restore TS dist cache before integration tests
        type: string
        default: 'false'
      test_suites:
        description: Comma list of rust,node,sherpa to run (path-based selection on PRs); empty = all
        type: string
        default: ''
      runner:
        description: runs-on override; empty = vars.NWR_RUNNER_LARGE or nwr-large
        type: string
        default: ''

# Kubernetes container mode defaults run: steps to `sh -e`; the steps use bash syntax.
defaults:
  run:
    shell: bash

jobs:
  # The two jobs run in parallel on separate runner pods: `rust` (lint, cargo tests) and `node-sherpa`
  # (native binding, npm tests, helpers integration, Sherpa E2E). Each runs scripts/ci/run-pr-integration.sh
  # with CI_TEST_SUITES limited to the suites it owns. A caller's `needs.<job>.result` covers both.
  rust:
    name: Rust tests
    runs-on: ${{ inputs.runner || vars.NWR_RUNNER_LARGE || 'nwr-large' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:test
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TURN_AVAILABLE: '1'
      CI: 'true'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      OPUS_STATIC: '1'
      # Job pods run as root on a workspace owned by the runner user; checkout's safe.directory is temporary.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'
    steps:
      # Migration measurement: CPUs, cgroup limits and CPU model of the runner this job got.
      - name: Runner facts
        run: |
          echo "runner=${RUNNER_NAME:-unknown} nproc=$(nproc)"
          echo "cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
          grep -m1 'model name' /proc/cpuinfo || true

      # workflow_call coerces booleans; normalize once in bash for reliable step if: gates.
      - name: Resolve integration test gates
        id: gate
        env:
          SKIP: ${{ inputs.skip }}
          NEEDS_NATIVE: ${{ inputs.needs_native_binding }}
          NEEDS_TS: ${{ inputs.needs_ts_dist }}
          SUITES: ${{ inputs.test_suites }}
        run: |
          is_true() {
            case "$1" in
              true|True|TRUE|1|yes|Yes|YES) return 0 ;;
              *) return 1 ;;
            esac
          }
          # Suites this job owns: (inputs.test_suites, or every suite when empty) intersected with
          # rust. An empty intersection skips the work and the job still succeeds; it must never
          # pass an empty CI_TEST_SUITES to the script, because empty there means every suite.
          OWNED="rust"
          suites="${SUITES//[[:space:]]/}"
          selected=""
          for suite in ${OWNED//,/ }; do
            if [[ -z "$suites" || ",$suites," == *",$suite,"* ]]; then
              selected="${selected:+$selected,}$suite"
            fi
          done
          echo "suites=$selected" >> "$GITHUB_OUTPUT"
          if is_true "$SKIP"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping integration tests — no source code changes in this PR."
          elif [[ -z "$selected" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to run in this job: test suites '${suites:-all}' do not include rust."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if is_true "$NEEDS_NATIVE"; then
            echo "needs_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_native=false" >> "$GITHUB_OUTPUT"
          fi
          if is_true "$NEEDS_TS"; then
            echo "needs_ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_ts=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Run integration tests (ci-test container, coturn in-process)
        id: integration
        if: steps.gate.outputs.skip != 'true'
        env:
          CI_TEST_SUITES: ${{ steps.gate.outputs.suites }}
        run: bash "${{ inputs.test_script }}"

      - name: Runner facts (end)
        if: always()
        run: echo "memory.peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"

  node-sherpa:
    name: Node + Sherpa tests
    runs-on: ${{ inputs.runner || vars.NWR_RUNNER_LARGE || 'nwr-large' }}
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:test
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TURN_AVAILABLE: '1'
      CI: 'true'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      OPUS_STATIC: '1'
      # Job pods run as root on a workspace owned by the runner user; checkout's safe.directory is temporary.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'
    steps:
      # Migration measurement: CPUs, cgroup limits and CPU model of the runner this job got.
      - name: Runner facts
        run: |
          echo "runner=${RUNNER_NAME:-unknown} nproc=$(nproc)"
          echo "cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
          grep -m1 'model name' /proc/cpuinfo || true

      # workflow_call coerces booleans; normalize once in bash for reliable step if: gates.
      - name: Resolve integration test gates
        id: gate
        env:
          SKIP: ${{ inputs.skip }}
          NEEDS_NATIVE: ${{ inputs.needs_native_binding }}
          NEEDS_TS: ${{ inputs.needs_ts_dist }}
          SUITES: ${{ inputs.test_suites }}
        run: |
          is_true() {
            case "$1" in
              true|True|TRUE|1|yes|Yes|YES) return 0 ;;
              *) return 1 ;;
            esac
          }
          # Suites this job owns: (inputs.test_suites, or every suite when empty) intersected with
          # node,sherpa. An empty intersection skips the work and the job still succeeds; it must never
          # pass an empty CI_TEST_SUITES to the script, because empty there means every suite.
          OWNED="node,sherpa"
          suites="${SUITES//[[:space:]]/}"
          selected=""
          for suite in ${OWNED//,/ }; do
            if [[ -z "$suites" || ",$suites," == *",$suite,"* ]]; then
              selected="${selected:+$selected,}$suite"
            fi
          done
          echo "suites=$selected" >> "$GITHUB_OUTPUT"
          if is_true "$SKIP"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping integration tests — no source code changes in this PR."
          elif [[ -z "$selected" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to run in this job: test suites '${suites:-all}' do not include node,sherpa."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if is_true "$NEEDS_NATIVE"; then
            echo "needs_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_native=false" >> "$GITHUB_OUTPUT"
          fi
          if is_true "$NEEDS_TS"; then
            echo "needs_ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_ts=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Download native binding artifact
        id: binding-artifact
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.needs_native == 'true' && inputs.binding_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binding_artifact }}
          path: ci-binding-artifact
        continue-on-error: ${{ inputs.require_binding_artifact != 'true' }}

      - name: Stage downloaded .node into packages/bindings
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.needs_native == 'true' && inputs.binding_artifact != '' && steps.binding-artifact.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          # Supports flat (*.node) and directory (bindings-*/ *.node) artifact layouts.
          nodes=(ci-binding-artifact/*.node ci-binding-artifact/**/*.node)
          if [[ ${#nodes[@]} -eq 0 ]]; then
            echo "Downloaded artifact had no .node files" >&2
            exit 1
          fi
          cp "${nodes[0]}" packages/bindings/

      - uses: ./.github/actions/ci-cache-ts-dist
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.needs_ts == 'true'
        id: ts-cache
        with:
          node_major: '20'

      - name: Run integration tests (ci-test container, coturn in-process)
        id: integration
        if: steps.gate.outputs.skip != 'true'
        env:
          TS_DIST_CACHE_HIT: ${{ steps.ts-cache.outputs.cache-hit || 'false' }}
          CI_TEST_SUITES: ${{ steps.gate.outputs.suites }}
        run: bash "${{ inputs.test_script }}"

      - name: Runner facts (end)
        if: always()
        run: echo "memory.peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"

      # Native DTLS/ICE trace written by scripts/ci/run-pr-integration.sh. The script deletes the
      # directory when the helpers integration step passes, so files exist only after that step failed.
      - name: Upload native trace (helpers integration failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-trace-${{ github.run_id }}
          path: .test-logs/native-trace
          if-no-files-found: ignore
          retention-days: 7
