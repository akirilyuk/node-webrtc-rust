name: Sherpa E2E stress

# Runs the Sherpa e2e block (scripts/ci/run-sherpa-example-ci.sh e2e) N times in one job on
# nwr-large and stops at the first failure: proof for flaky-tests-root-cause.md (20 consecutive
# green runs) before changing how the roundtrips run. Dispatch-only; spends no vendor credit.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Consecutive Sherpa e2e runs (stop at first failure)
        default: '20'
      mode:
        description: e2e = the full CI Sherpa block per iteration; roundtrips = roundtrips only (models prepared once, no Rust ignored tests)
        type: choice
        default: e2e
        options:
          - e2e
          - roundtrips
      only:
        description: Comma list of roundtrip npm scripts to keep (SHERPA_E2E_ONLY); empty = all
        default: ''
      parallel:
        description: Parallel-group width (SHERPA_E2E_PARALLEL); empty = the CI default
        default: ''
      cpu_burn:
        description: Busy-loop processes pinning spare cores during the loop (reproduce CPU starvation); 0 = none
        default: '0'

permissions:
  contents: read
  packages: read

concurrency:
  group: sherpa-e2e-stress-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  OPUS_STATIC: '1'
  # Job pods run as root on a workspace owned by the runner user; checkout's safe.directory is temporary.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'

# Kubernetes container mode defaults run: steps to `sh -e`; the steps use bash syntax.
defaults:
  run:
    shell: bash

jobs:
  stress:
    name: Sherpa e2e x${{ inputs.iterations }}
    runs-on: ${{ vars.NWR_RUNNER_LARGE || 'nwr-large' }}
    timeout-minutes: 420
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:test
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Migration measurement: CPUs, cgroup limits and CPU model of the runner this job got.
      - name: Runner facts
        run: |
          echo "runner=${RUNNER_NAME:-unknown} nproc=$(nproc)"
          echo "cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
          grep -m1 'model name' /proc/cpuinfo || true

      - uses: actions/checkout@v4

      # Same preparation as scripts/ci/run-pr-integration.sh before its Sherpa block (the Sherpa
      # block needs the debug .node, synced bindings and the TS dist; models come from
      # run-sherpa-example-ci.sh itself).
      - name: Prepare (npm ci, debug .node, TS dist)
        run: |
          bash scripts/ci/npm-ci-workspace.sh
          bash scripts/ci/build-native-addon.sh --target x86_64-unknown-linux-gnu --profile debug
          bash scripts/ci/sync-workspace-bindings.sh
          bash scripts/ci/ensure-ts-dist.sh
          if [[ "${{ inputs.mode }}" == "roundtrips" ]]; then
            bash scripts/ci/ensure-sherpa-models.sh
          fi

      - name: Sherpa e2e loop
        env:
          ITERATIONS: ${{ inputs.iterations }}
          MODE: ${{ inputs.mode }}
          ONLY: ${{ inputs.only }}
          PARALLEL: ${{ inputs.parallel }}
          CPU_BURN: ${{ inputs.cpu_burn }}
        run: |
          set -uo pipefail
          if ! [[ "$ITERATIONS" =~ ^[0-9]+$ ]] || [[ "$ITERATIONS" -lt 1 ]]; then
            echo "iterations must be a positive integer, got: $ITERATIONS" >&2
            exit 2
          fi
          if [[ "$CPU_BURN" =~ ^[0-9]+$ ]] && [[ "$CPU_BURN" -gt 0 ]]; then
            echo "==> burning ${CPU_BURN} core(s) for the whole loop (starvation reproduction)"
            burn_pids=()
            for ((b = 0; b < CPU_BURN; b++)); do yes >/dev/null & burn_pids+=($!); done
            trap 'kill "${burn_pids[@]}" 2>/dev/null || true' EXIT
          fi
          [[ -n "$ONLY" ]] && export SHERPA_E2E_ONLY="$ONLY"
          [[ -n "$PARALLEL" ]] && export SHERPA_E2E_PARALLEL="$PARALLEL"
          if [[ "$MODE" == "roundtrips" ]]; then
            # roundtrips mode expects the model paths in the environment (prepared once above).
            # shellcheck source=/dev/null
            source scripts/export-sherpa-local-models.sh
            export SHERPA_LID_MODEL_PATH="${SHERPA_LID_MODEL_PATH:-$PWD/examples/voice-agent-local-sherpa/.models/sherpa-onnx-whisper-tiny}"
          fi
          {
            echo "## Sherpa e2e stress (${ITERATIONS} iterations, mode=${MODE}, only=${ONLY:-all}, parallel=${PARALLEL:-default}, cpu_burn=${CPU_BURN:-0})"
            echo
            echo "| iteration | seconds |"
            echo "|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
          # Each iteration's output is also kept in a file: the job log can be missing (run 39933589322
          # had no log blob), and a failure must stay explainable. Uploaded as an artifact on failure.
          stress_dir="$PWD/.test-logs/stress"
          mkdir -p "$stress_dir"
          for ((i = 1; i <= ITERATIONS; i++)); do
            echo "==> stress iteration $i/$ITERATIONS"
            start=$SECONDS
            bash scripts/ci/run-sherpa-example-ci.sh "$MODE" 2>&1 | tee "$stress_dir/iteration-$i.log"
            rc=${PIPESTATUS[0]}
            if [[ "$rc" -ne 0 ]]; then
              green=$((i - 1))
              echo "stress FAILED at iteration $i after $green green (exit $rc)"
              {
                echo
                echo "stress FAILED at iteration $i after $green green (exit $rc)"
                echo
                echo '```'
                grep -E 'FAILED|FAIL |roundtrip failure|expected|passed only on|user_speech_final|timed out|panicked|Error' \
                  "$stress_dir/iteration-$i.log" | tail -n 40
                echo '```'
              } >>"$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            rm -f "$stress_dir/iteration-$i.log"
            echo "| $i | $((SECONDS - start)) |" >>"$GITHUB_STEP_SUMMARY"
          done
          echo "stress OK: ${ITERATIONS}/${ITERATIONS} green"
          {
            echo
            echo "stress OK: ${ITERATIONS}/${ITERATIONS} green"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload stress logs (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-stress-logs-${{ github.run_id }}
          path: |
            .test-logs/stress
            .test-logs/sherpa-e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Runner facts (end)
        if: always()
        run: echo "memory.peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
