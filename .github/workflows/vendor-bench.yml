name: Vendor latency bench

# Measures time to first audio (TTS) and STT open / partial / final latency of cloud speech
# vendors against their real APIs: crates/vendor-<id>/tests/live_bench.rs, run through the CLI
# benchmarks/scripts/bench-vendors.mjs (`npm run bench:vendors`). It spends vendor credit and
# needs the vendor secrets.
#
# `all` measures the published vendor set; unpublished vendors (benchmarks/scripts/vendors.mjs)
# run only when chosen by name.
#
# Triggers:
#   - label `vendor-bench` on a same-repo pull request: runs the published vendor set (`all`), one at a time, from
#     the PR branch (GitHub only dispatches workflow_dispatch workflows that exist on the default
#     branch, so an unmerged branch needs this trigger).
#   - manual dispatch: `vendor` is `all` or one vendor; `runs`, `transport` (all, websocket, http
#     or auto) and `region` (a label for the result folder and summary) are inputs. A single
#     vendor runs with --require, so a missing key fails instead of skipping.
#   - fork pull requests never run: the job runs on a self-hosted runner and forks get no secrets.
#
# The step summary is summary.md of the CLI (median / p90 per metric); the artifact
# vendor-bench-<run id> holds bench-results/ (raw.jsonl, summary.json, summary.md,
# environment.json) and the cargo logs. The CLI never writes a key into a result file, and the
# last step deletes any log that contains one.
#
# The runner host is shared with other CI jobs. The CLI waits (--wait-idle) for a quiet host
# before each vendor and marks starved, failed or suspended vendors as inconclusive; only one
# bench runs at a time repo-wide (concurrency group `vendor-bench`).
#
# Every vendor secret is mapped to the library's env name; the CLI hands each cargo run only its
# own vendor's variables and sets <VENDOR>_LIVE_REQUIRED=1.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Vendor crate to bench, or all'
        required: true
        type: choice
        default: all
        options:
          - all
          - deepgram
          - elevenlabs
          - cartesia
          - assemblyai
          - google
          - groq
          - azure
          - aws
          - openai
          - fishaudio
          - mistral
      runs:
        description: 'Runs per sample'
        required: false
        default: '10'
      transport:
        description: 'Transport to measure'
        required: false
        type: choice
        default: all
        options:
          - all
          - websocket
          - http
          - auto
      location:
        description: 'Where the bench runs: eu = the self-hosted EU runner kept for benchmarks, th = ARC nwr-large on staging-local (Thailand)'
        required: false
        type: choice
        default: eu
        options:
          - eu
          - th
      region:
        description: 'Label for the result folder and summary; empty = ci-<location>'
        required: false
        default: ''
      mistral_base_url:
        description: 'Mistral only: API origin (https://api.mistral.ai, https://api.eu.mistral.ai or https://api.us.mistral.ai); empty = global'
        required: false
        default: ''

permissions:
  contents: read
  packages: read # pull the ci-build image from GHCR

env:
  # Job pods run as root on a workspace owned by the runner user; checkout's safe.directory is temporary.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
# Kubernetes container mode defaults run: steps to `sh -e`; the steps use bash syntax.
defaults:
  run:
    shell: bash
concurrency:
  group: vendor-bench
  cancel-in-progress: false

jobs:
  bench:
    name: Bench ${{ github.event_name == 'workflow_dispatch' && inputs.vendor || 'all' }}
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'vendor-bench' && github.event.pull_request.head.repo.full_name == github.repository)
    # eu: the one old self-hosted runner kept in the EU for benchmarks (label-triggered PR runs too).
    # th: ARC nwr-large on staging-local. The location changes the measured latency, so it is a choice.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.location == 'th') && (vars.NWR_RUNNER_LARGE || 'nwr-large') || 'self-hosted' }}
    # Same image and build env as the other cargo jobs (reusable-test.yml CI_IMAGE and the
    # ci-run-integration-tests docker run).
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI: 'true'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      OPUS_STATIC: '1'
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_LIVE_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_LIVE_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_LIVE_KEY }}
      CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_LIVE_VOICE_ID }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_LIVE_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_LIVE_API_KEY }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_LIVE_PROJECT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_LIVE_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_LIVE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_LIVE_SPEECH_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_LIVE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_LIVE_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_LIVE_REGION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_LIVE_KEY }}
      FISH_API_KEY: ${{ secrets.FISH_AUDIO_API }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      # Empty means unset: the Mistral crate then uses the global endpoint.
      MISTRAL_BASE_URL: ${{ inputs.mistral_base_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Google service account file
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_LIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            umask 077
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcp-sa.json"
            chmod 600 "$RUNNER_TEMP/gcp-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Bench
        shell: bash
        env:
          VENDORS: ${{ github.event_name == 'workflow_dispatch' && inputs.vendor || 'all' }}
          RUNS: ${{ inputs.runs || '10' }}
          TRANSPORT: ${{ inputs.transport || 'all' }}
          REGION: ${{ inputs.region || (inputs.location == 'th' && 'ci-th' || 'ci-eu') }}
          # The CI container cannot run git, so environment.json takes the commit from here.
          NWR_BENCH_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--vendors "$VENDORS" --runs "$RUNS" --transport "$TRANSPORT" --region "$REGION" --wait-idle 900 --out bench-results)
          if [ "$VENDORS" != "all" ]; then args+=(--require); fi
          status=0
          node benchmarks/scripts/bench-vendors.mjs "${args[@]}" || status=$?
          if [ -f bench-results/summary.md ]; then cat bench-results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"

      - name: Delete logs that contain a key value
        if: always()
        shell: bash
        run: node benchmarks/scripts/bench-vendors.mjs --scrub-logs .test-logs/bench-vendors

      - name: Upload bench results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vendor-bench-${{ github.run_id }}
          path: |
            bench-results/
            .test-logs/bench-vendors/
          retention-days: 7
          if-no-files-found: warn
