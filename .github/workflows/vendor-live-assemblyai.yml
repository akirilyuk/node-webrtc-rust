name: Vendor live — AssemblyAI

# Runs the AssemblyAI live tests (crates/vendor-assemblyai/tests/live_test.rs) against the real API.
# The API key is the repo secret ASSEMBLYAI_LIVE_KEY, mapped to the library's ASSEMBLYAI_API_KEY env var.
#
# Fork PRs are skipped on purpose: this repo is public and the job runs on a self-hosted
# runner, so fork code must never run there, and forks get no secrets anyway. Pull requests
# from branches of this repo and manual dispatches run the job.
#
# A missing key fails the job (first step, and ASSEMBLYAI_LIVE_REQUIRED=1 makes the tests panic
# instead of skipping), so a skipped live test can never show green.

on:
  pull_request:
    paths:
      - 'crates/vendor-assemblyai/**'
      - 'crates/vendor-live-support/**'
      - '.github/workflows/vendor-live-assemblyai.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read # pull the ci-build image from GHCR

concurrency:
  group: vendor-live-assemblyai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: AssemblyAI live
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    # Same image and build env as the other cargo jobs (reusable-test.yml CI_IMAGE and the
    # ci-run-integration-tests docker run).
    container:
      # The test variant of ci-build: it carries the Whisper tiny model (/opt/sherpa-models) that the
      # runner-config full-stack tests need for language ID (docker/ci/Dockerfile.test).
      image: ghcr.io/${{ github.repository }}/ci-build:test
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI: 'true'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      OPUS_STATIC: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Require AssemblyAI key
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_LIVE_KEY }}
        run: |
          if [ -z "$ASSEMBLYAI_API_KEY" ]; then
            echo "::error::secret ASSEMBLYAI_LIVE_KEY is empty"
            exit 1
          fi

      - name: AssemblyAI live tests
        shell: bash
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_LIVE_KEY }}
          ASSEMBLYAI_LIVE_REQUIRED: '1'
        run: |
          cargo test -p node-webrtc-rust-vendor-assemblyai --features live --test live_test -- --nocapture --test-threads=1 2>&1 | tee live.log; status=${PIPESTATUS[0]}; grep -oE 'assemblyai_[a-z_]+ .*' live.log >> "$GITHUB_STEP_SUMMARY" || true; exit $status

      - name: AssemblyAI full-stack STT (VoiceAgent, production VAD preset, runner staging config)
        shell: bash
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_LIVE_KEY }}
          ASSEMBLYAI_LIVE_REQUIRED: '1'
        run: |
          cargo test -p node-webrtc-rust-vendor-assemblyai --features live --test live_fullstack -- --nocapture --test-threads=1 2>&1 | tee fullstack.log; status=${PIPESTATUS[0]}; grep -oE 'assemblyai_[a-z_]*fullstack_[a-z_]+ .*' fullstack.log >> "$GITHUB_STEP_SUMMARY" || true; exit $status
