name: Vendor live — Cartesia

# Runs the Cartesia live tests (crates/vendor-cartesia/tests/live_test.rs) against the real API.
# The API key is the repo secret CARTESIA_LIVE_KEY, mapped to the library's CARTESIA_API_KEY env var.
# The voice is the repo secret CARTESIA_LIVE_VOICE_ID, mapped to CARTESIA_VOICE_ID (Cartesia has no
# default voice).
#
# Fork PRs are skipped on purpose: this repo is public and the job runs on our own runners
# (ARC scale set nwr-large; the repo variable NWR_RUNNER_LARGE=self-hosted falls back to the
# old runners), so fork code must never run there, and forks get no secrets anyway. Pull requests
# from branches of this repo and manual dispatches run the job.
#
# A missing key or voice fails the job (first step, and CARTESIA_LIVE_REQUIRED=1 makes the tests panic
# instead of skipping), so a skipped live test can never show green.

on:
  pull_request:
    paths:
      - 'crates/vendor-cartesia/**'
      - 'crates/vendor-live-support/**'
      - '.github/workflows/vendor-live-cartesia.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read # pull the ci-build image from GHCR

concurrency:
  group: vendor-live-cartesia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Cartesia live
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.NWR_RUNNER_LARGE || 'nwr-large' }}
    # Same image and build env as the other cargo jobs (reusable-test.yml CI_IMAGE and the
    # ci-run-integration-tests docker run).
    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI: 'true'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      OPUS_STATIC: '1'
    steps:
      # Migration measurement: CPUs, cgroup limits and CPU model of the runner this job got.
      - name: Runner facts
        run: |
          echo "runner=${RUNNER_NAME:-unknown} nproc=$(nproc)"
          echo "cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
          grep -m1 'model name' /proc/cpuinfo || true

      - uses: actions/checkout@v4

      - name: Require Cartesia key and voice
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_LIVE_KEY }}
          CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_LIVE_VOICE_ID }}
        run: |
          if [ -z "$CARTESIA_API_KEY" ]; then
            echo "::error::secret CARTESIA_LIVE_KEY is empty"
            exit 1
          fi
          if [ -z "$CARTESIA_VOICE_ID" ]; then
            echo "::error::secret CARTESIA_LIVE_VOICE_ID is empty"
            exit 1
          fi

      - name: Cartesia live tests
        shell: bash
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_LIVE_KEY }}
          CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_LIVE_VOICE_ID }}
          CARTESIA_LIVE_REQUIRED: '1'
        run: |
          cargo test -p node-webrtc-rust-vendor-cartesia --features live --test live_test -- --nocapture --test-threads=1 2>&1 | tee live.log; status=${PIPESTATUS[0]}; grep -oE 'cartesia_[a-z_]+ .*' live.log >> "$GITHUB_STEP_SUMMARY" || true; exit $status
