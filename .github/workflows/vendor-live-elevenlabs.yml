name: Vendor live — ElevenLabs

# Runs the ElevenLabs live tests (crates/vendor-elevenlabs/tests/live_test.rs) against the real API.
# The API key is the repo secret ELEVENLABS_LIVE_KEY, mapped to the library's ELEVENLABS_API_KEY env var.
#
# Fork PRs are skipped on purpose: this repo is public and the job runs on our own runners
# (ARC scale set nwr-large; the repo variable NWR_RUNNER_LARGE=self-hosted falls back to the
# old runners), so fork code must never run there, and forks get no secrets anyway. Pull requests
# from branches of this repo and manual dispatches run the job.
#
# A missing key fails the job (first step, and ELEVENLABS_LIVE_REQUIRED=1 makes the tests panic
# instead of skipping), so a skipped live test can never show green.

on:
  pull_request:
    paths:
      - 'crates/vendor-elevenlabs/**'
      - 'crates/vendor-live-support/**'
      - '.github/workflows/vendor-live-elevenlabs.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read # pull the ci-build image from GHCR

concurrency:
  group: vendor-live-elevenlabs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: ElevenLabs live
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.NWR_RUNNER_LARGE || 'nwr-large' }}
    # Same image and build env as the other cargo jobs (reusable-test.yml CI_IMAGE and the
    # ci-run-integration-tests docker run).
    container:
      # The test variant of ci-build: it carries the Whisper tiny model (/opt/sherpa-models) that the
      # runner-config full-stack tests need for language ID (docker/ci/Dockerfile.test).
      image: ghcr.io/${{ github.repository }}/ci-build:test
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI: 'true'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      OPUS_STATIC: '1'
    steps:
      # Migration measurement: CPUs, cgroup limits and CPU model of the runner this job got.
      - name: Runner facts
        run: |
          echo "runner=${RUNNER_NAME:-unknown} nproc=$(nproc)"
          echo "cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
          grep -m1 'model name' /proc/cpuinfo || true

      - uses: actions/checkout@v4

      - name: Require ElevenLabs key
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_LIVE_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::secret ELEVENLABS_LIVE_KEY is empty"
            exit 1
          fi

      - name: ElevenLabs live tests
        shell: bash
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_LIVE_KEY }}
          ELEVENLABS_LIVE_REQUIRED: '1'
        run: |
          cargo test -p node-webrtc-rust-vendor-elevenlabs --features live --test live_test -- --nocapture --test-threads=1 2>&1 | tee live.log; status=${PIPESTATUS[0]}; grep -oE 'elevenlabs_[a-z_]+ .*' live.log >> "$GITHUB_STEP_SUMMARY" || true; exit $status

      - name: ElevenLabs full-stack STT (VoiceAgent, production VAD preset, runner staging config, idle session)
        shell: bash
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_LIVE_KEY }}
          ELEVENLABS_LIVE_REQUIRED: '1'
        run: |
          cargo test -p node-webrtc-rust-vendor-elevenlabs --features live --test live_fullstack -- --nocapture --test-threads=1 2>&1 | tee fullstack.log; status=${PIPESTATUS[0]}; grep -oE 'elevenlabs_[a-z_]*fullstack_[a-z_]+ .*' fullstack.log >> "$GITHUB_STEP_SUMMARY" || true; exit $status
