[package]
name = "node-webrtc-rust-vendor-assemblyai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AssemblyAI STT in-repo WebSocket client"

[features]
default = []
# The client is always compiled; the feature only gates the live tests and bench.
live = []

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
node-webrtc-rust-speech = { path = "../speech" }
node-webrtc-rust-voice-catalog = { path = "../voice-catalog" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# Pins the `ring` backend: tokio-tungstenite enables rustls with no crypto provider, so a plain
# Rust consumer of this crate would otherwise panic when building the TLS client.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }

[dev-dependencies]
node-webrtc-rust-vendor-live-support = { path = "../vendor-live-support", features = ["sherpa-lid"] }
# `test-util` gives `tokio::time::pause`/`advance` for the timeout tests.
tokio = { workspace = true, features = ["test-util"] }
