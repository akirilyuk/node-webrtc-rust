[package]
name = "node-webrtc-rust-vendor-fishaudio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fish Audio TTS (WS/HTTP) and realtime STT in-repo clients"

[features]
default = []
live = [
    "dep:base64",
    "dep:reqwest",
    "dep:futures-util",
    "dep:tokio-tungstenite",
    "dep:rmp-serde",
    "dep:serde_bytes",
]

[dependencies]
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
bytes = { workspace = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
node-webrtc-rust-speech = { path = "../speech" }
node-webrtc-rust-voice-catalog = { path = "../voice-catalog" }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
rmp-serde = { version = "1", optional = true }
serde = { workspace = true }
serde_bytes = { version = "0.11", optional = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.26", optional = true, default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }

[dev-dependencies]
# `test-util` gives `start_paused` for the first-audio timeout test.
tokio = { workspace = true, features = ["test-util"] }
