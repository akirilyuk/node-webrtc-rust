[package]
name = "node-webrtc-rust-vendor-groq"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Groq STT/TTS vendor adapter (OpenAI-compatible audio endpoints)"

[features]
default = []
live = ["dep:reqwest", "dep:serde"]

[dependencies]
async-trait = "0.1"
bytes = { workspace = true }
node-webrtc-rust-speech = { path = "../speech" }
node-webrtc-rust-voice-catalog = { path = "../voice-catalog" }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
