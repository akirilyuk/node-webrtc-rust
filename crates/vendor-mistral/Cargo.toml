[package]
name = "node-webrtc-rust-vendor-mistral"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mistral Voxtral TTS and realtime STT in-repo clients"

[features]
default = []
# Gates the real-network tests (tests/live_test.rs, live_endpoints.rs, live_bench.rs) and the
# bench-only `__test` module. The HTTP client itself is always built, because the mock-server
# tests run without it.
live = []

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
node-webrtc-rust-speech = { path = "../speech" }
node-webrtc-rust-voice-catalog = { path = "../voice-catalog" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }

[dev-dependencies]
node-webrtc-rust-vendor-live-support = { path = "../vendor-live-support" }
# TCP+TLS connect timing in tests/live_endpoints.rs (same stack as reqwest/tokio-tungstenite).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
