[package]
name = "node-webrtc-rust-vendor-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenAI STT/TTS vendor adapter for node-webrtc-rust"

[features]
default = []
live = [
    "dep:async-openai",
    "dep:base64",
    "dep:futures-util",
    "dep:reqwest",
    "dep:tokio-tungstenite",
]

[dependencies]
async-openai = { version = "0.28", optional = true }
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
bytes = { workspace = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
node-webrtc-rust-speech = { path = "../speech" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.26", optional = true, default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
