<text class="t3" x="24" y="334" font-size="12">Seeded lossy-pipe stress test. The patched build also stays at 0 / 200 at 50 % loss and with reordering and delay. RFC</text><text class="t3" x="24" y="350" font-size="12">6347 §4.2.4 fix proposed upstream as webrtc-rs/webrtc#921.</text>
