<rect class="bg" width="800" height="368" rx="8"/>
<text class="t1" x="24" y="34" font-size="20" font-weight="600">DTLS handshakes that never finish on a lossy link</text><text class="t2" x="24" y="54" font-size="14">Handshakes stuck out of 200 concurrent ones, by packet loss. The server never resent its last</text><text class="t2" x="24" y="74" font-size="14">flight, so one lost datagram left the client hanging. Lower is better.</text>
