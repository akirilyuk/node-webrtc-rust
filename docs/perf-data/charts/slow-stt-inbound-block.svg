<text class="t1" x="24" y="34" font-size="20" font-weight="600">A slow STT vendor no longer makes the agent deaf</text><text class="t2" x="24" y="54" font-size="14">Longest single process_inbound_pcm call (one 20 ms audio frame) while the STT vendor is slow. Same</text><text class="t2" x="24" y="74" font-size="14">tests on each release. Lower is better. Log scale.</text>
