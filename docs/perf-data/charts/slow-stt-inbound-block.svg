51054446,384 661.8985251054446,384H274Z"><title>0.9.48 · Stream opens refused for ~60 s: 57.0 s</title></path><text class="t1" x="671.8985251054446" y="379.5" font-size="13" font-weight="600">57.0 s</text><path class="s1" d="M274,386H661.8847159241045Q665.8847159241045,386 665.8847159241045,390V400Q665.8847159241045,404 661.8847159241045,404H274Z"><title>0.10.0 · Stream opens refused for ~60 s: 57.0 s</title></path><text class="t1" x="671.8847159241045" y="399.5" font-size="13" font-weight="600">57.0 s</text><path class="s2" d="M274,406H275.5Q277,406 277,407.5V422.5Q277,424 275.5,424H274Z"><title>0.11.2 · Stream opens refused for ~60 s: &lt; 1 ms</title></path><text class="t1" x="283" y="419.5" font-size="13" font-weight="600">&lt; 1 ms</text><line class="axis" x1="274" y1="120" x2="274" y2="430"/>
<text class="t3" x="24" y="474" font-size="12">VoiceAgent + cluster speech client + mock speech server over gRPC, inbound frame every 20 ms. The 0.11.2 tests were</text><text class="t3" x="24" y="490" font-size="12">copied into the 0.9.48 and 0.10.0 checkouts with compile fixes only (perf-data/2026-10-16/slow-stt). Since 0.11.0 each</text><text class="t3" x="24" y="506" font-size="12">agent runs STT in its own task.</text>
